name: Refresh backtest data

# The sandbox this repo is developed in cannot reach the SEC, so the stored filings are rebuilt here. Run it by hand
# (Actions tab, "Run workflow") after the engine learns a new XBRL tag. It re-downloads the filings for the 132
# stored tickers, reruns the point-in-time backtest and commits the new data and report.
#
# One-time setup: add a repository secret named SEC_USER_AGENT holding "Your Name your@email" (the SEC asks every
# program to identify itself). The address stays out of the public repo this way.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail early without the secret
        run: test -n "$SEC_USER_AGENT" || (echo "Add the SEC_USER_AGENT repository secret first" && exit 1)
      - run: python engine/refresh_edgar.py backtest/data
      - run: python engine/backtest.py backtest/data --out backtest/REPORT.md --records backtest/records.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest
          git diff --cached --quiet || git commit -m "Refresh backtest filings and rerun the backtest"
          git push
