name: Fetch earnings dates

# Downloads the date and time of every earnings release (8-K Item 2.02) since mid-2009 for each name in
# backtest/data_wide, from the SEC, and commits backtest/data_wide/earnings_8k.json.gz. Then run the event study.
# Run by hand from the Actions tab. Needs the SEC_USER_AGENT secret (see refresh-backtest.yml).
# If it stops part way, run it again: names already fetched are kept.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail early without the secret
        run: test -n "$SEC_USER_AGENT" || (echo "Add the SEC_USER_AGENT repository secret first" && exit 1)
      - run: pip install -r requirements.txt
      - run: python engine/fetch_filing_dates.py backtest/data_wide
      - name: Commit the dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/data_wide/earnings_8k.json.gz
          git diff --cached --quiet || git commit -m "Add earnings release dates from SEC 8-K filings"
          git push
