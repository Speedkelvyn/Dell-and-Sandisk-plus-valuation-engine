name: Weekly consensus snapshot

# Yahoo serves only today's analyst estimates, so a backtest can never see past ones. This saves a snapshot every
# week; after a few months it gives the backtest real point-in-time estimates.
on:
  schedule:
    - cron: "17 11 * * 5" # Fridays, 11:17 UTC (before the US open)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python engine/consensus_snapshot.py consensus/universe.txt --out consensus
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consensus
          git diff --cached --quiet || git commit -m "Consensus snapshot $(date -u +%F)"
          git push
