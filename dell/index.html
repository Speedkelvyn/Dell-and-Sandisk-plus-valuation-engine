      <div style="margin-top:8px"><button class="btn" type="button" id="ldSave">Save current inputs as JSON</button></div>
      <p class="note">The same file drives the other two tools: <code>python excel_model.py FILE.json</code> writes the live-formula Excel workbook, and <code>valuation_framework.ipynb</code> walks through every step with the formulas printed.</p></section>
    <section class="box"><h2>The framework <span>same engine, same numbers, three ways to work</span></h2><div class="kv">
      <span>1 · History and earnings quality</span><span>FA, EQ</span>
      <span>2 · Future cash flows (FCFF; excess returns for banks and insurers; dividends for REITs)</span><span>MODEL</span>
      <span>3 · Discount rate: rf, Rm, MRP, daily-regression beta, Ke, WACC</span><span>WACC, BETA</span>
      <span>4 · Discount the cash flows and the terminal value</span><span>DCF</span>
      <span>5 · Enterprise value → equity value → ÷ shares → fair price</span><span>VAL</span>
      <span>6 · Verdict: model, Monte Carlo, comps, regression → call and expected alpha</span><span>DES, RV, MC, FFLD</span>
      <span>Where every number came from</span><span>AUD, SRC</span></div>
      <p class="note">Excel workbook: each step is a sheet of live formulas with a "your value" column next to every pulled input. Notebook: each step is a cell that prints the formula with its numbers. All three use one engine and are tested to give identical values.</p></section>
  </div>`;
      };
      RENDER.LOAD.after = () => {
        const L = LOADSTATE;
        $("loadForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const t = $("ldTicker").value.trim().toUpperCase();
          if (!t) return;
          L.ticker = t;
          L.peers = $("ldPeers").value;
          L.busy = true;
          L.err = "";
          L.log = [];
          render();
          try {
            const inp = await research(
              t,
              L.peers
                .split(/[,\s]+/)
                .map((x) => x.trim().toUpperCase())
                .filter(Boolean),
            );
            CO.list[t] = inp;
            CO.active = t;
            saveCompanies();
            logLine(`Done. ${Object.keys(inp.provenance).length} inputs tagged with sources.`, "ok");
            S.inp = M.clone(inp);
            S.mcKey = "";
            S.scen = "Base";
            L.busy = false;
            go("DES");
          } catch (err) {
            L.busy = false;
            const code = err && err.code;
            L.err =
              ERRCOPY[code] ||
              (code === "tool_error" ? "The browser couldn't load a page: " : "Research stopped: ") +
                (err && err.message ? err.message : String(err));
            logLine(L.err, "err");
            render();
          }
        });
        $("ldSuggest").addEventListener("click", async () => {
          const t = $("ldTicker").value.trim().toUpperCase();
          if (!t) return;
          const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
          if (!sample) {
            L.err = "Peer suggestions need the page to be open in Claude.";
            render();
            return;
          }
          $("ldSuggest").disabled = true;
          $("ldSuggest").textContent = "Thinking…";
          try {
            const arr = await sample.json(
              `List 6 publicly traded comparable companies for valuing ${t} with relative multiples: same business lines and customers, similar scale where possible, listed in the US (ADRs allowed). Reply with only a JSON array of Yahoo Finance ticker strings, for example ["AAA","BBB"].`,
              { modelTier: "default" },
            );
            if (Array.isArray(arr)) {
              L.ticker = t;
              L.peers = arr
                .filter((x) => typeof x === "string")
                .map((x) => x.toUpperCase())
                .slice(0, 8)
                .join(", ");
              L.err = "";
            }
          } catch (err) {
            L.err =
              err.code === "not_granted"
                ? "Peer suggestions were declined."
                : "Couldn't get suggestions: " + (err.message || err.code);
          }
          render();
        });
        document
          .querySelectorAll("[data-open]")
          .forEach((b) => b.addEventListener("click", () => switchCompany(b.dataset.open)));
        document.querySelectorAll("[data-del]").forEach((b) =>
          b.addEventListener("click", () => {
            const t = b.dataset.del;
            delete CO.list[t];
            if (CO.active === t) {
              CO.active = "builtin";
              S.inp = M.clone(DATA);
              S.mcKey = "";
            }
            saveCompanies();
            render();
          }),
        );
        $("ldFile").addEventListener("change", (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const fr = new FileReader();
          fr.onload = () => {
            try {
              const inp = JSON.parse(fr.result);
              if (!inp.meta || !inp.market || !inp.scenarios) throw new Error("it isn't an inputs file");
              M.dcf(inp, inp.scenarios.Base || Object.values(inp.scenarios)[0]);
              const t = inp.meta.ticker;
              CO.list[t] = inp;
              CO.active = t;
              saveCompanies();
              S.inp = M.clone(inp);
              S.mcKey = "";
              S.scen = inp.scenarios.Base ? "Base" : Object.keys(inp.scenarios)[0];
              go("DES");
            } catch (err) {
              L.err = "That file couldn't be used: " + err.message;
              render();
            }
          };
          fr.readAsText(f);
        });
        $("ldSave").addEventListener("click", async () => {
          const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
          if (!dl) {
            L.err = "Saving files needs the page to be open in Claude.";
            render();
            return;
          }
          try {
            await dl.save({
              filename: `${S.inp.meta.ticker}_inputs.json`,
              data: JSON.stringify(S.inp, null, 1),
            });
          } catch (err) {
            if (err.code !== "cancelled" && err.code !== "declined") {
              L.err = "The file wasn't saved: " + (err.message || err.code);
              render();
            }
          }
        });
      };

      // ---------------------------------------------------------------- audit
      function auditRows() {
        const P = S.inp.provenance || {};
        const base = M.dcf(S.inp, S.inp.scenarios[S.scen]).perShare;
        const rows = [];
        for (const [path, [kind, source]] of Object.entries(P)) {
          let v;
          try {
            v = get(S.inp, path);
          } catch (e) {
            continue;
          }
          if (typeof v !== "number") continue;
          if (path.startsWith("scenarios.") && !path.startsWith(`scenarios.${S.scen}.`)) continue;
          let impact = null;
          if (!(path === "capital.beta_custom" && S.inp.capital.beta_source !== "custom")) {
            try {
              const I = M.clone(S.inp);
              const bump = Math.abs(v) < 1 ? v + 0.01 : v * 1.1;
              set(I, path, bump);
              impact = M.dcf(I, I.scenarios[S.scen]).perShare - base;
            } catch (e) {
              impact = null;
            }
          }
          rows.push({ path, v, kind, source, impact, step: Math.abs(v) < 1 ? "+1pp" : "+10%" });
        }
        return rows;
      }
      RENDER.AUD = () => {
        const rows = auditRows(),
          n = (k) => rows.filter((r) => r.kind === k).length;
        const fmtv = (r) =>
          Math.abs(r.v) < 1 && !/beta|multiple|dilution/.test(r.path) ? pct(r.v, 2) : f2(r.v);
        const assum = rows
          .filter((r) => r.kind === "assumption" && r.impact != null && Math.abs(r.impact) > 0.005)
          .sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact));
        const badge = (k) =>
          `<span class="pv ${k === "sourced" ? "s" : k === "derived" ? "d" : "a"}">${k[0].toUpperCase()}</span>`;
        return `
  <div class="title"><h1>AUD · Where every input comes from</h1><div class="sub">${S.inp.meta.ticker} · ${S.scen} case · S = sourced, D = derived from sourced numbers, A = assumption</div></div>
  <div class="grid">
    <section class="box c4"><h2>Inputs by origin</h2><div class="kv">
      <span>${badge("sourced")} Sourced from filings or data feeds</span><span>${n("sourced")}</span>
      <span>${badge("derived")} Derived from sourced numbers</span><span>${n("derived")}</span>
      <span>${badge("assumption")} Assumptions (modelling choices)</span><span>${n("assumption")}</span></div>
      <p class="note">Sourced and derived inputs come straight from filings or data feeds, with the formula for derived ones. Assumptions are modelling choices: change them in MODEL, WACC or DCF and the valuation updates. The table on the right ranks them by how much they move the DCF.</p></section>
    <section class="box c8"><h2>Assumptions that move the value most <span>change in DCF $/share for the step shown</span></h2><div class="scroll"><table>
      <thead><tr><th>Input</th><th>Value</th><th>Step</th><th>Δ value/share</th><th class="l">Basis</th></tr></thead><tbody>
      ${assum
        .slice(0, 12)
        .map(
          (r) =>
            `<tr><td>${r.path}</td><td>${fmtv(r)}</td><td>${r.step}</td><td class="${cls(r.impact)}">${r.impact >= 0 ? "+" : ""}${f2(r.impact)}</td><td class="l mut" style="white-space:normal">${r.source}</td></tr>`,
        )
        .join("")}
      </tbody></table></div></section>
    <section class="box"><h2>All inputs <span>${rows.length} with a recorded source</span></h2><div class="scroll"><table>
      <thead><tr><th>Input</th><th>Value</th><th>Origin</th><th class="l">Source / basis</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${r.path}</td><td>${fmtv(r)}</td><td>${badge(r.kind)}</td><td class="l mut" style="white-space:normal">${r.source}</td></tr>`).join("")}
      </tbody></table></div></section>
  </div>`;
      };

      // ---------------------------------------------------------------- financials (banks, insurers, REITs)
      // Same tabs, different engine: excess-return model (book + PV of ROE above Ke) or dividend discount model.
      const FINR = {};
      const isER = () => S.inp.model === "excess_return";
      const MODEL_NAME = {
        fcff: "FCFF DCF",
        excess_return: "Excess-return model",
        ddm: "Dividend discount model",
      };
      const finName = () => MODEL_NAME[S.inp.model] || "DCF";
      const short = () => (isER() ? "Excess return" : "DDM");
      function finModelPicker() {
        const alt = S.inp.alt_models || {};
        const opts = ["excess_return", "ddm"].filter((k) => k === S.inp.model || alt[k]);
        if (opts.length < 2) return `<b>${finName()}</b>`;
        return `<select class="f" id="finModel" aria-label="Valuation model">${opts.map((k) => `<option value="${k}" ${k === S.inp.model ? "selected" : ""}>${MODEL_NAME[k]}</option>`).join("")}</select>`;
      }
      function switchFinModel(to) {
        const I = S.inp;
        if (to === I.model || !(I.alt_models || {})[to]) return;
        I.alt_models[I.model] = {
          scenarios: I.scenarios,
          relative_weights: I.relative.weights,
          verdict_weights: I.verdict.weights,
        };
        const n = I.alt_models[to];
        I.model = to;
        I.scenarios = n.scenarios;
        I.relative.weights = n.relative_weights;
        I.verdict.weights = n.verdict_weights;
        delete I.alt_models[to];
        S.mcKey = "";
        render();
      }
      const multName = {
        pe_fwd: "Forward P/E",
        pb: "Price / book",
        div_yield: "Dividend yield",
        ev_ebitda: "EV / EBITDA (TTM)",
        ev_sales: "EV / Sales (TTM)",
      };
      const multFmt = (k, x) => (k === "div_yield" ? pct(x, 2) : mx(x));

      function finFfItems(R) {
        const I = S.inp,
          c = I.consensus.targets,
          m = I.market,
          sc = R.scen3,
          rt = R.rel.table,
          k = R.W.ke,
          scen = I.scenarios[S.scen];
        const g = M.sensitivity(I, scen, "wacc", [k - 0.01, k + 0.01], "g", [
          I.terminal.g - 0.005,
          I.terminal.g + 0.005,
        ])
          .flat()
          .filter(isFinite);
        const out = [
          { label: "52-week range", lo: m.low_52w, hi: m.high_52w, color: "#4b525c" },
          { label: "Street targets (low–high)", lo: c.low, hi: c.high, color: "#6b5a2a" },
          { label: `${short()} bear–bull`, lo: sc.Bear.perShare, hi: sc.Bull.perShare, color: "#2f6db3" },
          { label: `${short()} Ke ±1pp, g ±0.5pp`, lo: Math.min(...g), hi: Math.max(...g), color: "#2f6db3" },
        ];
        if (isER()) {
          const r = [-0.02, 0.02].map((d) => M.valueAt(I, scen, "roe_lr", scen.roe[1] + d));
          out.push({ label: "Long-run ROE ±2pp", lo: Math.min(...r), hi: Math.max(...r), color: "#2f6db3" });
        } else {
          const r = [-0.01, 0.01].map((d) => M.valueAt(I, scen, "dps_shift", d));
          out.push({
            label: "Dividend growth ±1pp",
            lo: Math.min(...r),
            hi: Math.max(...r),
            color: "#2f6db3",
          });
        }
        out.push({ label: "Monte Carlo p10–p90", lo: R.mc.p10, hi: R.mc.p90, color: "#2a7f62" });
        for (const key of Object.keys(rt))
          if (rt[key].usable) {
            const a = rt[key].impliedQ1,
              b = rt[key].impliedQ3;
            out.push({
              label: `Comps ${multName[key]} (IQR)`,
              lo: Math.min(a, b),
              hi: Math.max(a, b),
              color: "#7a4fb3",
            });
          }
        if (isER() && isFinite(R.reg.implied)) {
          const bv = I.fin.bv0 / M.dilutedShares(I),
            v = [-0.02, 0.02].map((d) => (R.reg.a + R.reg.b * (I.fin.roe_ttm + d)) * bv);
          out.push({
            label: "P/B–ROE regression ±2pp ROE",
            lo: Math.min(...v),
            hi: Math.max(...v),
            color: "#7a4fb3",
          });
        }
        return out.filter((d) => isFinite(d.lo) && isFinite(d.hi));
      }

      FINR.DES = (R) => {
        const I = S.inp,
          v = R.ver,
          b = R.base,
          sc = R.scen3,
          c = I.consensus.targets,
          vw = I.verdict.weights,
          m = I.market;
        const chip = v.call === "OVERVALUED" ? "over" : v.call === "UNDERVALUED" ? "under" : "fair";
        const wts = Object.entries(I.relative.weights).filter(([, w]) => w > 0);
        const methods = [
          [`${short()} — Bear`, sc.Bear.perShare, ""],
          [`${short()} — Base`, sc.Base.perShare, ""],
          [`${short()} — Bull`, sc.Bull.perShare, ""],
          ["Monte Carlo median", R.mc.median, `p10 ${px(R.mc.p10)} · p90 ${px(R.mc.p90)}`],
          [
            `Comps blend (${wts.map(([k]) => multName[k]).join(" · ")})`,
            R.rel.blended,
            wts.map(([, w]) => pct(w, 0)).join("/"),
          ],
        ];
        if (isER())
          methods.push([
            "P/B–ROE regression",
            R.reg.implied,
            isFinite(R.reg.r2) ? `R² ${R.reg.r2.toFixed(2)}, n=${R.reg.n}` : `n=${R.reg.n} (too few peers)`,
          ]);
        methods.push(["Street median target (12m)", c.median, `${c.n} analysts`]);
        const bvps = I.fin.bv0 / M.dilutedShares(I);
        const revRows = isER()
          ? `
        <tr><td>Cost of equity</td><td>${pct(R.W.ke, 2)}</td><td>${pct(R.rev.ke, 2)}</td><td>${spct(R.rev.ke - R.W.ke, 2)}</td></tr>
        <tr><td>Long-run ROE (from ${Y(4)})</td><td>${pct(I.scenarios[S.scen].roe[1], 1)}</td><td>${pct(R.rev.roe, 1)}</td><td>${spct(R.rev.roe - I.scenarios[S.scen].roe[1], 1)}</td></tr>
        <tr><td>Share of the ROE spread kept forever</td><td>${pct(I.terminal.er_persistence ?? 1, 0)}</td><td>${isFinite(R.rev.persist) ? pct(R.rev.persist, 0) : "not reachable in 0–100%"}</td><td></td></tr>
        <tr><td>Terminal growth</td><td>${pct(I.terminal.g, 2)}</td><td>${isFinite(R.rev.g) ? pct(R.rev.g, 2) : "not reachable below Ke"}</td><td></td></tr>`
          : `
        <tr><td>Cost of equity</td><td>${pct(R.W.ke, 2)}</td><td>${pct(R.rev.ke, 2)}</td><td>${spct(R.rev.ke - R.W.ke, 2)}</td></tr>
        <tr><td>Dividend growth ${Y(0)}–${Y(3)} (shift)</td><td>${I.scenarios[S.scen].dps_growth.map((x) => pct(x, 1)).join(" · ")}</td><td>${spct(R.rev.dps, 2)} each year</td><td></td></tr>
        <tr><td>Terminal growth</td><td>${pct(I.terminal.g, 2)}</td><td>${isFinite(R.rev.g) ? pct(R.rev.g, 2) : "not reachable below Ke"}</td><td></td></tr>`;
        return `
  <div class="title"><h1>DES · ${I.meta.name} — valuation summary</h1><div class="sub">${finModelPicker()} · ${I.meta.industry || ""} · scenario ${S.scen} · valuation date ${I.meta.valuation_date}</div></div>
  <div class="grid">
    <section class="box c5">
      <h2>Verdict <span>weights: ${short()} ${pct(vw.dcf, 0)} · MC ${pct(vw.mc, 0)} · comps ${pct(vw.comps, 0)} · regression ${pct(vw.regression, 0)}</span></h2>
      <div class="verdict">
        <div><div class="k">Fair value / share</div><div class="big">${px(v.fair)}</div></div>
        <div><div class="k">vs price ${px(m.price)}</div><div class="big ${cls(v.upside)}">${spct(v.upside)}</div></div>
        <div><div class="k">Call</div><div style="margin-top:6px"><span class="chip ${chip}" style="font-size:15px">${v.call}</span></div></div>
      </div>
      <div class="kv" style="margin-top:12px">
        <span>Expected 1-year return (convergence + ${pct(v.divYield, 2)} dividend)</span><span class="${cls(v.expectedReturn)}">${spct(v.expectedReturn)}</span>
        <span>Required return (CAPM Ke)</span><span>${pct(v.requiredReturn, 2)}</span>
        <span><b class="amb">Expected alpha</b> = expected − required</span><span class="${cls(v.alpha)}"><b>${spct(v.alpha)}</b></span>
        <span>P(intrinsic value &gt; price), Monte Carlo</span><span>${pct(R.mc.probAbove)}</span>
        ${
          isER()
            ? `<span>Price / book · justified P/B (${S.scen})</span><span>${mx(m.price / bvps)} · ${mx(b.justifiedPB)}</span>
        <span>Trailing ROE vs cost of equity</span><span class="${cls(I.fin.roe_ttm - R.W.ke)}">${pct(I.fin.roe_ttm, 1)} vs ${pct(R.W.ke, 1)}</span>`
            : `<span>Dividend yield · yield the ${S.scen} value implies</span><span>${pct(I.fin.dps0 / m.price, 2)} · ${pct(b.impliedYield, 2)}</span>
        <span>(Net income + D&A) ÷ dividends</span><span class="${I.fin.dividend_cover != null && I.fin.dividend_cover < 1 ? "down" : ""}">${I.fin.dividend_cover != null ? mx(I.fin.dividend_cover) : "—"}</span>`
        }
      </div>
      <p class="note" style="margin-top:10px">${
        isER()
          ? "Banks and insurers are valued on equity: their debt is raw material, so free cash flow to the firm and WACC do not apply. Value = book equity + present value of future earnings above the cost of equity."
          : "REITs pay out most of their earnings by law, so the dividend is the cash the shareholder gets. Value = present value of dividends at the cost of equity."
      }</p>
    </section>
    <section class="box c7">
      <h2>What ${px(m.price)} implies <span>reverse ${short()}, ${S.scen} case, each solved alone</span></h2>
      <table><thead><tr><th>Lever</th><th>Model</th><th>Needed to justify price</th><th>Gap</th></tr></thead><tbody>${revRows}</tbody></table>
      <p class="note">Street median ${px(c.median)} is ${mx(c.median / I.consensus.eps[Y(1)])} ${Y(1)} consensus EPS${isER() ? ` and ${mx(c.median / bvps)} today's book per share (${px(bvps)})` : ""}.</p>
    </section>
    <section class="box c6">
      <h2>Value by method <span>$ per share</span></h2>
      <table><thead><tr><th>Method</th><th>Value</th><th>vs price</th><th>Detail</th></tr></thead><tbody>
      ${methods.map(([n, x, d]) => `<tr><td>${n}</td><td>${px(x)}</td><td class="${cls(x / m.price - 1)}">${spct(x / m.price - 1)}</td><td class="mut">${d}</td></tr>`).join("")}
      <tr class="sum hl"><td>Blended fair value</td><td>${px(v.fair)}</td><td class="${cls(v.upside)}">${spct(v.upside)}</td><td class="mut">${v.call}</td></tr>
      </tbody></table>
    </section>
    <section class="box c6"><h2>Price vs fair value <span>daily close, last 4 months</span></h2><div class="chart"><canvas id="cPrice"></canvas></div>
      <div class="legend"><span><i style="background:#e9e7e2"></i>Close</span><span><i style="background:#ffa028"></i>Model fair value</span><span><i style="background:#6b5a2a"></i>Street median</span></div></section>
    <section class="box"><h2>Football field <span>full view in FFLD</span></h2><div class="chart"><canvas id="cFF"></canvas></div></section>
  </div>`;
      };
      FINR.DES.after = (R) => RENDER.DES.after(R);

      FINR.MODEL = (R) => {
        const I = S.inp,
          sk = S.scen,
          sp = `scenarios.${sk}`,
          rows = R.base.rows;
        const col = (f) => rows.map((r) => `<td>${f(r)}</td>`).join("");
        if (isER())
          return `
  <div class="title"><h1>MODEL · ROE and book value — ${sk} case</h1><div class="sub">Yellow fields are editable · book grows by retained earnings: ROE × (1 − payout)</div></div>
  <div class="grid">
    <section class="box c5"><h2>Drivers</h2><div class="kv">
      <span>Book equity at ${I.fin.bv_date || I.meta.balance_sheet_date}, $m</span><span>${fld("fin.bv0", "num", "w", 0)}</span>
      <span>Tangible book, $m</span><span>${f0(I.fin.tbv0)}</span>
      <span>ROE ${Y(0)}</span><span>${fld(`${sp}.roe.0`, "pct", "", 1)}</span>
      <span>Long-run ROE (${Y(4)} onwards)</span><span>${fld(`${sp}.roe.1`, "pct", "", 1)}</span>
      <span>Payout (dividends + buybacks) ÷ earnings</span><span>${fld("fin.payout", "pct", "", 1)}</span>
      <span>Implied book growth, long run</span><span>${pct(I.scenarios[sk].roe[1] * (1 - I.fin.payout), 1)}</span>

          rt = R.rel.table,

          cols = I.peers.columns,
          ix = (k) => cols.indexOf(k),
          m = I.market;
        const all = Object.keys(I.peers.rows),
          bvps = I.fin.bv0 / M.dilutedShares(I);
        const cell = (r, k, f) => `<td>${f(r[ix(k)])}</td>`;
        return `
  <div class="title"><h1>RV · Relative valuation</h1><div class="sub">${isER() ? "Banks and insurers: forward P/E and price-to-book" : "REITs: dividend yield and EV/EBITDA"} · non-positive multiples excluded</div></div>
  <div class="grid">
    <section class="box c7"><h2>Peers <span>tick to include in the comps set</span></h2><div class="scroll"><table>
      <thead><tr><th>In</th><th class="l">Ticker</th><th>Fwd P/E</th><th>P/B</th><th>ROE</th><th>Div yield</th><th>EV/EBITDA</th><th>Beta</th><th>Mkt cap $B</th></tr></thead><tbody>
      ${all
        .map((tk) => {
          const r = I.peers.rows[tk],
            on = I.peers.core_set.includes(tk);
          return `<tr><td><input type="checkbox" data-peer="${tk}" ${on ? "checked" : ""} aria-label="include ${tk}"></td><td class="l">${tk} <span class="mut">${r[0]}</span></td>${cell(r, "pe_fwd", mx)}${cell(r, "pb", mx)}${cell(r, "roe", (x) => pct(x))}${cell(r, "div_yield", (x) => pct(x, 2))}${cell(r, "ev_ebitda", mx)}${cell(r, "beta", (x) => (x == null ? "—" : x.toFixed(2)))}${cell(r, "mcap", (x) => f1(x / 1000))}</tr>`;
        })
        .join("")}
      <tr class="sum hl"><td></td><td class="l">${I.meta.ticker}</td><td>${mx(m.price / m.eps_ntm)}</td><td>${mx(m.price / bvps)}</td><td>${pct(I.fin.roe_ttm)}</td><td>${pct(I.fin.dps0 / m.price, 2)}</td><td>${rt.ev_ebitda ? mx(rt.ev_ebitda.own) : "—"}</td><td>${I.capital.beta_raw.toFixed(2)}</td><td>${f1((m.price * M.dilutedShares(I)) / 1000)}</td></tr>
      </tbody></table></div><p class="note">${(I.notes && I.notes.comps) || ""}</p></section>
    <section class="box c5"><h2>Implied value <span><select class="f" id="relStat" aria-label="Statistic">${["median", "harmonic", "mean"].map((s) => `<option ${I.relative.stat === s ? "selected" : ""} value="${s}">${s}</option>`).join("")}</select></span></h2>
      <table><thead><tr><th>Multiple</th><th>Peer</th><th>${I.meta.ticker}</th><th>Implied</th><th>Weight</th></tr></thead><tbody>
      ${Object.keys(rt)
        .map(
          (k) =>
            `<tr><td>${multName[k]}</td><td>${multFmt(k, rt[k].k)}</td><td>${multFmt(k, rt[k].own)}</td><td>${px(rt[k].implied)}</td><td>${fld(`relative.weights.${k}`, "pct", "", 0)}</td></tr>`,
        )
        .join("")}
      <tr class="sum hl"><td>Weighted blend</td><td></td><td></td><td>${px(R.rel.blended)}</td><td></td></tr></tbody></table>
      ${
        isER()
          ? `<h2 style="margin-top:14px">Price-to-book vs ROE <span>OLS across peers with both</span></h2><div class="kv">
      <span>P/B = a + b·ROE</span><span>${isFinite(reg.a) ? reg.a.toFixed(2) + " + " + reg.b.toFixed(2) + "·ROE" : "—"}</span>
      <span>R² / n</span><span class="${!(reg.r2 >= 0.3) || reg.n < 5 ? "warn" : ""}">${isFinite(reg.r2) ? reg.r2.toFixed(2) : "—"} / ${reg.n}</span>
      <span>${I.meta.ticker} trailing ROE → fitted P/B → value</span><span>${pct(I.fin.roe_ttm)} → ${mx(reg.pe)} → ${px(reg.implied)}</span></div>
      ${reg.n < 5 ? `<p class="note warn">Only ${reg.n} peers: a line through so few points fits easily and proves little.</p>` : ""}`
          : ""
      }</section>
    ${isER() ? `<section class="box"><h2>Scatter <span>price-to-book vs ROE</span></h2><div class="chart"><canvas id="cReg"></canvas></div></section>` : ""}
  </div>`;
      };
      FINR.RV.after = (R) => {
        if (!isER() || !R.reg.points || !R.reg.points.length) return;
        const reg = R.reg,
          I = S.inp,
          xs = reg.points.map((p) => p.x).concat([I.fin.roe_ttm]),
          x0 = Math.min(...xs) * 0.9,
          x1 = Math.max(...xs) * 1.05;
        const bvps = I.fin.bv0 / M.dilutedShares(I);
        chart("cReg", {
          type: "scatter",
          data: {
            datasets: [
              {
                label: "Peers",
                data: reg.points.map((p) => ({ x: p.x * 100, y: p.y, t: p.t })),
                backgroundColor: "#4aa3ff",
                pointRadius: 5,
              },
              {
                label: `${I.meta.ticker} (trailing ROE, current P/B)`,
                data: [{ x: I.fin.roe_ttm * 100, y: I.market.price / bvps, t: I.meta.ticker }],
                backgroundColor: "#ffa028",
                pointRadius: 7,
              },
              {
                label: "Fit",
                data: [
                  { x: x0 * 100, y: reg.a + reg.b * x0 },
                  { x: x1 * 100, y: reg.a + reg.b * x1 },
                ],
                type: "line",
                borderColor: "#8b9099",
                borderDash: [5, 4],
                pointRadius: 0,
              },
            ],
          },
          options: {
            plugins: {
              legend: { labels: { boxWidth: 10 } },
              tooltip: {
                callbacks: {
                  label: (c) => `${c.raw.t || "fit"}: ROE ${c.raw.x.toFixed(1)}%, P/B ${c.raw.y.toFixed(2)}x`,
                },
              },
            },
            scales: {
              x: { title: { display: true, text: "ROE, %" } },
              y: { title: { display: true, text: "Price / book" } },
            },
          },
        });
      };

      FINR.EE = (R) => {
        const I = S.inp,
          c = I.consensus,
          rows = R.base.rows;
        const line = (n, model, cons, f) =>
          `<tr><td>${n}</td><td>${f(model)}</td><td>${f(cons)}</td><td class="${cls(model / cons - 1)}">${spct(model / cons - 1)}</td></tr>`;
        return `
  <div class="title"><h1>EE · Model vs consensus</h1><div class="sub">${S.scen} case</div></div>
  <div class="grid">
    <section class="box c6"><h2>Estimates</h2>
      <table><thead><tr><th></th><th>Model</th><th>Consensus</th><th>Diff</th></tr></thead><tbody>
      ${
        isER()
          ? line(Y(0) + " EPS (full-year rate)", rows[0].epsAdj, c.eps[Y(0)], px) +
            line(Y(1) + " EPS", rows[1].epsAdj, c.eps[Y(1)], px)
          : `<tr><td>${Y(0)} dividend per share</td><td>${px(rows[0].dps)}</td><td>—</td><td></td></tr><tr><td>${Y(0)} EPS (consensus)</td><td>—</td><td>${px(c.eps[Y(0)])}</td><td></td></tr>`
      }
      </tbody></table>
      <p class="note">${isER() ? `${Y(0)} model EPS is the year-1 ROE on today's book; the year-1 ROE is set from consensus EPS, so a gap here comes from share count or book timing.` : "REIT EPS is after property depreciation and says little about cash; the model works on dividends."} ${c.note || ""}</p></section>
    <section class="box c6"><h2>${isER() ? "EPS path" : "Dividend path"} <span>model, $ per share</span></h2><div class="chart"><canvas id="cEPS"></canvas></div></section>
  </div>`;
      };
      FINR.EE.after = (R) => {
        const rows = R.base.rows,
          c = S.inp.consensus.eps;
        chart("cEPS", {
          type: "bar",
          data: {
            labels: rows.map((r) => r.label),
            datasets: isER()
              ? [
                  { label: "Model EPS", data: rows.map((r) => r.epsAdj), backgroundColor: "#2f6db3" },
                  {
                    label: "Consensus",
                    data: rows.map((r) => (c[r.label] != null ? c[r.label] : null)),
                    type: "line",
                    borderColor: "#ffa028",
                    pointRadius: 4,
                    showLine: false,
                  },
                ]
              : [{ label: "Dividend per share", data: rows.map((r) => r.dps), backgroundColor: "#2f6db3" }],
          },
          options: {
            plugins: { legend: { labels: { boxWidth: 10 } } },
            scales: { y: { ticks: { callback: (v) => "$" + v } } },
          },
        });
      };

      // ---------------------------------------------------------------- earnings quality
      const GRADE_COL = {
        A: "var(--up)",
        B: "#9bd77f",
        C: "var(--warn)",
        D: "var(--down)",
        "n/a": "var(--muted)",
      };
      RENDER.EQ = (R) => {
        const I = S.inp,
          E = M.earningsQuality(I),
          q = I.quality_data || {};
        const gate = I.verdict.quality_gate !== false;
        if (E.grade === "n/a" && !E.years.length)
          return `
  <div class="title"><h1>EQ · Earnings quality</h1><div class="sub">Beneish M-score · accruals · cash conversion</div></div>
  <div class="grid"><section class="box"><h2>Not graded</h2><p class="note">${E.reason}</p></section></div>`;
        const L = E.limits,
          yrs = E.years,
          keys = ["DSRI", "GMI", "AQI", "SGI", "DEPI", "SGAI", "LVGI", "TATA"];
        const names = {
          DSRI: "Days sales in receivables",
          GMI: "Gross margin (prior ÷ current)",
          AQI: "Asset quality (soft assets)",
          SGI: "Sales growth",
          DEPI: "Depreciation rate (prior ÷ current)",
          SGAI: "SG&A ÷ sales",
          LVGI: "Leverage",
          TATA: "Accruals ÷ total assets",
        };
        const fmt = (x) => (x == null || !isFinite(x) ? '<span class="mut">n/a</span>' : x.toFixed(3));
        const hot = (k, x) => x != null && isFinite(x) && k !== "SGAI" && k !== "LVGI" && x > E.manip[k];
        const flagRow = (f) =>
          `<li class="${f.level === "red" ? "down" : f.level === "amber" ? "warn" : "mut"}">${f.msg}</li>`;
        const effect =
          E.grade === "D"
            ? gate
              ? "The call is withheld (NO CALL) until the accounts are checked."
              : "Gate is off: the call is shown despite grade D."
            : E.grade === "C"
              ? gate
                ? "The call is shown with low confidence."
                : "Gate is off."
              : "No effect on the call.";
        return `
  <div class="title"><h1>EQ · Earnings quality</h1><div class="sub">Are the earnings backed by cash? Beneish M-score · Sloan accruals · cash conversion · latest ${q.labels ? q.labels[q.labels.length - 1] : ""}</div></div>
  <div class="grid">
    <section class="box c4"><h2>Grade</h2>
      <div style="display:flex;align-items:center;gap:16px"><div style="font:600 64px/1 var(--mono);color:${GRADE_COL[E.grade]}">${E.grade}</div>
        <div class="note" style="margin:0">A: no flags · B: one amber · C: two ambers or one red · D: two or more reds</div></div>
      <ul class="list" style="margin-top:10px">${E.flags.length ? E.flags.map(flagRow).join("") : '<li class="up">No flags</li>'}</ul>
      <div class="kv" style="margin-top:10px"><span>Effect on the call</span><span>${effect}</span>
        <span>Gate</span><span><select class="f" id="eqGate" aria-label="Quality gate"><option value="on" ${gate ? "selected" : ""}>on</option><option value="off" ${gate ? "" : "selected"}>off</option></select></span></div></section>
    <section class="box c8"><h2>Beneish M-score <span>M = −4.84 + 0.92·DSRI + 0.528·GMI + 0.404·AQI + 0.892·SGI + 0.115·DEPI − 0.172·SGAI + 4.679·TATA − 0.327·LVGI</span></h2><div class="scroll"><table>
      <thead><tr><th class="l">Index</th>${yrs.map((y) => `<th>${y.label}</th>`).join("")}<th>Coef.</th><th>Manipulator mean</th></tr></thead><tbody>
      ${keys.map((k) => `<tr><td class="l">${k} <span class="mut">${names[k]}</span></td>${yrs.map((y) => `<td class="${hot(k, y.idx[k]) ? "warn" : ""}">${fmt(y.idx[k])}${y.neutral.includes(k) ? '<span class="mut"> →1</span>' : ""}</td>`).join("")}<td>${E.coef[k]}</td><td class="mut">${E.manip[k]}</td></tr>`).join("")}
      <tr class="sum hl"><td class="l">M-score</td>${yrs.map((y) => `<td class="${y.m > L.mRed ? "down" : y.m > L.mAmber ? "warn" : "up"}">${isFinite(y.m) ? y.m.toFixed(2) : "—"}</td>`).join("")}<td></td><td class="mut">red &gt; −1.78 · amber &gt; −2.22</td></tr>
      </tbody></table></div>
      <p class="note">Beneish (1999): firms later caught manipulating earnings had M above −1.78 before the fact. Amber cells sit above the manipulators' average. A high index has innocent explanations too (fast growth lifts SGI, a large customer win lifts DSRI), so a flag is a reason to read the notes, not a verdict.</p></section>
    <section class="box c4"><h2>Accruals and cash</h2><div class="kv">
      <span>Accruals ÷ average assets (Sloan)</span><span class="${E.accruals > L.accrRed ? "down" : E.accruals > L.accrAmber ? "warn" : "up"}">${pct(E.accruals, 1)}</span>
      <span>Operating cash flow ÷ net income, ${E.cashYears} years</span><span class="${E.cashConv < L.ccRed ? "down" : E.cashConv < L.ccAmber ? "warn" : "up"}">${pct(E.cashConv, 0)}</span></div>
      <p class="note">Red: accruals above 10% of assets or cash conversion below 50%. Amber: above 5% or below 80%. Sloan (1996) found high-accrual firms underperform: their earnings revert.</p></section>
    <section class="box c8"><h2>Net income vs operating cash flow <span>$m</span></h2><div class="chart"><canvas id="cEQ"></canvas></div></section>
  </div>`;
      };
      RENDER.EQ.after = () => {
        const q = S.inp.quality_data;
        if (!q || !q.labels) return;
        chart("cEQ", {
          type: "bar",
          data: {
            labels: q.labels,
            datasets: [
              { label: "Net income (continuing)", data: q.ni, backgroundColor: "#2f6db3" },
              { label: "Operating cash flow", data: q.cfo, backgroundColor: "#2a7f62" },
            ],
          },
          options: {
            plugins: { legend: { labels: { boxWidth: 10 } } },
            scales: { y: { ticks: { callback: (x) => f0(x) } } },
          },
        });
      };

      // ---------------------------------------------------------------- fail-closed screens
      // Numeric paths can be fixed in place; other items explain what to change.
      function fixField(path) {
        const v = get(S.inp, path);
        if (
          path.startsWith("meta.") ||
          path.startsWith("peers.") ||
          path === "capital.beta_source" ||
          path.startsWith("verdict.weights")
        )
          return "";
        const pctLike =
          /(^capital\.(rf|rm|erp|kd_pretax|tax_marginal)$)|(^operating\.)|(^terminal\.(g|ronic|er_persistence)$)|(^scenarios\.)|(^fin\.payout$)/.test(
            path,
          );
        if (
          v !== undefined ||
          /^(bridge|market|capital|operating|terminal|scenarios|y1_segments|rev_y0|fin)/.test(path)
        )
          return fld(path, pctLike ? "pct" : "num", "w");
        return "";
      }
      function notValued(Q) {
        const li = Q.blocking
          .map((b) => `<li><b>${b.msg}</b> <span class="mut">[${b.path}]</span> ${fixField(b.path)}</li>`)
          .join("");
        const wl = Q.warnings.map((w) => `<li>${w.msg} <span class="mut">[${w.path}]</span></li>`).join("");
        return `<div class="title"><h1>NOT VALUED · ${S.inp.meta.ticker}</h1><div class="sub">The tool will not give a fair value until these inputs are fixed</div></div>
  <div class="dq blk"><h2>Blocking (${Q.blocking.length})</h2><ul>${li}</ul>
  <p class="note">A missing figure is never treated as zero. Enter it from the latest 10-Q or 10-K and the valuation runs again. LOAD and SRC stay open.</p></div>
  ${wl ? `<div class="dq"><h2>Warnings (${Q.warnings.length})</h2><ul>${wl}</ul></div>` : ""}`;
      }
      function dqStrip(W) {
        if (!W || !W.length) return "";
        return `<details class="dq"><summary>${W.length} data warning${W.length > 1 ? "s" : ""}: fallbacks and gaps in the inputs</summary><ul>${W.map(
          (w) => `<li>${w.msg} <span class="mut">[${w.path}]</span></li>`,
        ).join("")}</ul></details>`;
      }

      // ---------------------------------------------------------------- render loop
      function render() {
        let R;
        try {
          R = compute();
        } catch (e) {
          $("main").innerHTML =
            `<div class="box"><h2>Input error</h2><p class="note">${e.message}. Undo the last change or press Reset inputs.</p></div>`;
          return;
        }
        if (!tabOk(S.tab)) S.tab = "DES";
        renderHeader(R);
        for (const id of Object.keys(S.charts)) {
          S.charts[id].destroy();
          delete S.charts[id];
        }
        if (R.blocked && !["LOAD", "SRC"].includes(S.tab)) {
          $("main").innerHTML = notValued(R.blocked);
          return;
        }
        const RD = (M.isFin(S.inp) && FINR[S.tab]) || RENDER[S.tab];
        $("main").innerHTML = (R.checks ? dqStrip(R.ver.warnings) : "") + RD(R);
        if (RD.after) RD.after(R);
        $("foot").innerHTML =
          `${S.inp.meta.name} · ${S.inp.meta.units} · Prices ${S.inp.meta.price_date} close · Fundamentals to ${S.inp.meta.balance_sheet_date} · Educational research, not investment advice.${S.inp.meta.footnote ? " " + S.inp.meta.footnote : ""}`;
      }

      function go(tab) {
        if (!TABS.some((t) => t[0] === tab) || !tabOk(tab)) return false;
        S.tab = tab;
        try {
          localStorage.setItem(STORE("vt_tab"), tab);
        } catch (e) {}
        try {
          history.replaceState(null, "", "#" + tab);
        } catch (e) {}
        render();
        try {
          window.scrollTo(0, 0);
        } catch (e) {}
        return true;
      }

      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-tab]");
        if (t) {
          go(t.dataset.tab);
          return;
        }
        const s = e.target.closest("[data-scen]");
        if (s) {
          S.scen = s.dataset.scen;
          render();
          return;
        }
        const cs = e.target.closest("[data-cyscen]");
        if (cs) {
          const st = cyState();
          st.scen = cs.dataset.cyscen;
          st.x = { ...S.inp.cycle.scenarios[st.scen] };
          render();
        }
      });
      let cyRaf = 0;
      document.addEventListener("input", (e) => {
        const el = e.target;
        if (!el.matches("input.cyr")) return;
        cyState().x[el.dataset.cy] = parseFloat(el.value);
        if (!cyRaf)
          cyRaf = requestAnimationFrame(() => {
            cyRaf = 0;
            cyUpdate();
          });
      });
      document.addEventListener("change", (e) => {
        const el = e.target;
        if (el.matches("input.f[data-p]")) {
          const raw = parseFloat(el.value);
          if (!isFinite(raw)) {
            render();
            return;
          }
          set(S.inp, el.dataset.p, el.dataset.k === "pct" ? raw / 100 : raw);
          render();
        } else if (el.id === "coSel") {
          switchCompany(el.value);
        } else if (el.id === "finModel") {
          switchFinModel(el.value);
        } else if (el.id === "eqGate") {
          S.inp.verdict.quality_gate = el.value === "on";
          render();
        } else if (el.id === "betaSrc") {
          S.inp.capital.beta_source = el.value;
          render();
        } else if (el.id === "tvMethod") {
          S.inp.terminal.method = el.value;
          render();
        } else if (el.id === "relStat") {
          S.inp.relative.stat = el.value;
          render();
        } else if (el.matches("[data-peer]")) {
          const tk = el.dataset.peer,
            cs = S.inp.peers.core_set;
          if (el.checked && !cs.includes(tk)) cs.push(tk);
          if (!el.checked) {
            if (cs.length <= 2) {
              el.checked = true;
              return;
            }
            cs.splice(cs.indexOf(tk), 1);
          }
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.matches("input.f[data-p]"))
          e.target.dispatchEvent(new Event("change", { bubbles: true }));
      });
      $("cmdForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const words = $("cmdInput").value.toUpperCase().replace(/<GO>/g, "").split(/\s+/).filter(Boolean);
        const hit = words.reverse().find((w) => TABS.some((t) => t[0] === w));
        if (hit) {
          go(hit);
          $("cmdInput").value = "";
          return;
        }
        const tk = words
          .reverse()
          .find((w) => /^[A-Z][A-Z0-9.\-]{0,9}$/.test(w) && !["US", "EQUITY", "GO"].includes(w));
        if (tk) {
          if (companyData(tk)) {
            switchCompany(tk);
          } else {
            LOADSTATE.ticker = tk;
            go("LOAD");
          }
          $("cmdInput").value = "";
          return;
        }
        $("cmdInput").value = "UNKNOWN FUNCTION — TRY " + TABS.map((t) => t[0]).join(" ") + " OR A TICKER";
      });
      $("resetBtn").addEventListener("click", () => {
        S.inp = M.clone(companyData(CO.active) || DATA);
        render();
      });
      function switchCompany(t) {
        const d = companyData(t);
        if (!d) return;
        CO.active = t;
        saveCompanies();
        S.inp = M.clone(d);
        S.mcKey = "";
        S.scen = "Base";
        go(S.tab === "LOAD" ? "DES" : S.tab);
      }
      render();
    </script>
