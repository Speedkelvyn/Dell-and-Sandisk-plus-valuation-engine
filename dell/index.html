    <style>
      /* Layout: terminal shell — command line, function-key row, quote strip, one function panel at a time (Bloomberg-style). Deliberately single dark look. */
      :root {
        color-scheme: dark;
        --bg: #08090b; /* screen */
        --panel: #101216; /* function panel */
        --panel-2: #161a1f; /* table header / hover */
        --rule: #262b33; /* grid lines */
        --amber: #ffa028; /* labels, function codes */
        --amber-dim: #a8691c;
        --text: #e9e7e2; /* values */
        --muted: #8b9099;
        --input: #f6c344; /* editable fields (yellow, as on the terminal) */
        --input-bg: #1d1a10;
        --blue: #4aa3ff; /* headers / links */
        --up: #3ddc84;
        --down: #ff4d4d;
        --warn: #ffcc4d;
        --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
        color: var(--text);
      }
      body {
        font: 13px/1.45 var(--mono);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 12px 40px;
        font-variant-numeric: tabular-nums;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--bg);
      }
      a {
        color: var(--blue);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      /* ---- command line ---- */
      .cmd {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 8px;
      }
      .cmd .brand {
        font: 600 12px var(--cond);
        letter-spacing: 0.14em;
        color: var(--amber);
        text-transform: uppercase;
      }
      .cmd form {
        display: flex;
        flex: 1 1 260px;
        min-width: 0;
      }
      .cmd input {
        flex: 1;
        min-width: 0;
        background: var(--input-bg);
        border: 1px solid var(--amber-dim);
        border-right: 0;
        padding: 5px 8px;
        color: var(--input);
        text-transform: uppercase;
      }
      .cmd button.go {
        background: #2b6e2b;
        border: 1px solid #3f9a3f;
        color: #fff;
        padding: 5px 10px;
        font-weight: 600;
        cursor: pointer;
      }
      .cmd .asof {
        color: var(--muted);
        font-size: 11px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--rule);
      }
      .seg button {
        background: none;
        border: 0;
        padding: 4px 10px;
        color: var(--muted);
        cursor: pointer;
        font: 500 12px var(--cond);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .seg button[aria-pressed="true"] {
        background: var(--amber);
        color: #000;
      }
      .btn {
        background: var(--panel-2);
        border: 1px solid var(--rule);
        padding: 4px 10px;
        cursor: pointer;
        color: var(--text);
        font: 500 12px var(--cond);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .btn:hover {
        border-color: var(--amber-dim);
      }

      /* ---- function keys ---- */
      .fkeys {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px 0;
      }
      .fkeys button {
        background: #1a1408;
        border: 1px solid #3a2a10;
        color: var(--amber);
        padding: 4px 9px;
        cursor: pointer;
        font: 600 12px var(--mono);
      }
      .fkeys button small {
        color: var(--muted);
        font: 400 11px var(--cond);
        margin-left: 6px;
        letter-spacing: 0.03em;
      }
      .fkeys button[aria-selected="true"] {
        background: var(--amber);
        color: #000;
        border-color: var(--amber);
      }
      .fkeys button[aria-selected="true"] small {
        color: #3a2400;
      }

      /* ---- quote strip ---- */
      .quote {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
        gap: 0;
        border: 1px solid var(--rule);
        background: var(--panel);
      }
      .quote > div {
        padding: 7px 10px;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        min-width: 0;
      }
      .quote .k {
        color: var(--amber);
        font: 500 11px var(--cond);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .quote .v {
        font-size: 16px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .quote .tkr .v {
        color: var(--text);
        font-size: 18px;
      }
      @media (min-width: 700px) {
        .quote .tkr {
          grid-column: span 2;
        }
      }
      .chip {
        display: inline-block;
        padding: 1px 8px;
        font: 700 12px var(--cond);
        letter-spacing: 0.1em;
      }
      .chip.over {
        background: var(--down);
        color: #000;
      }
      .chip.under {
        background: var(--up);
        color: #000;
      }
      .chip.fair {
        background: var(--warn);
        color: #000;
      }
      .chip.nv {
        background: var(--muted);
        color: #000;
      }
      input.f.miss {
        border-color: var(--down);
        background: rgba(255, 77, 77, 0.08);
      }
      .dq {
        border: 1px solid var(--warn);
        padding: 6px 10px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .dq.blk {
        border-color: var(--down);
      }
      .dq summary {
        cursor: pointer;
        color: var(--warn);
      }
      .dq.blk h2 {
        color: var(--down);
      }
      .dq li {
        margin: 2px 0;
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }
      .mut {
        color: var(--muted);
      }
      .amb {
        color: var(--amber);
      }
      .warn {
        color: var(--warn);
      }

      /* ---- panels ---- */
      main {
        margin-top: 10px;
      }
      .title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--amber-dim);
        padding-bottom: 4px;
        margin-bottom: 10px;
      }
      .title h1 {
        margin: 0;
        font: 600 15px var(--cond);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .title .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(12, minmax(0, 1fr));
      }
      .box {
        grid-column: span 12;
        background: var(--panel);
        border: 1px solid var(--rule);
        padding: 10px;
        min-width: 0;
      }
      .box h2 {
        margin: 0 0 8px;
        font: 600 12px var(--cond);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--blue);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .box h2 span {
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: none;
      }
      @media (min-width: 900px) {
        .c3 {
          grid-column: span 3;
        }
        .c4 {
          grid-column: span 4;
        }
        .c5 {
          grid-column: span 5;
        }
        .c6 {
          grid-column: span 6;
        }
        .c7 {
          grid-column: span 7;
        }
        .c8 {
          grid-column: span 8;
        }
        .c9 {
          grid-column: span 9;
        }
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th,
      td {
        padding: 3px 7px;
        text-align: right;
        white-space: nowrap;
        border-bottom: 1px solid var(--rule);
      }
      th {
        color: var(--amber);
        font: 500 11px var(--cond);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: var(--panel-2);
        position: sticky;
        top: 0;
      }
      td:first-child,
      th:first-child,
      td.l,
      th.l {
        text-align: left;
      }
      tr.sum td {
        border-top: 1px solid var(--muted);
        font-weight: 600;
      }
      tr.hl td {
        background: #1c1608;
      }
      td.lbl {
        color: var(--muted);
      }
      .kv {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        font-size: 12px;
      }
      .kv > :nth-child(odd) {
        color: var(--muted);
      }
      .kv > :nth-child(even) {
        text-align: right;
      }
      .big {
        font-size: 28px;
        font-weight: 500;
        line-height: 1.1;
      }
      .note {
        color: var(--muted);
        font-size: 11.5px;
        max-width: 75ch;
      }
      .note b {
        color: var(--text);
        font-weight: 500;
      }
      .verdict {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .verdict .k {
        color: var(--amber);
        font: 500 11px var(--cond);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .cyr-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .cyr-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .cyr-row output {
        color: var(--input);
        text-align: right;
      }
      .cyr-row input {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: var(--amber);
        min-height: 24px;
      }
      .chart {
        position: relative;
        height: 260px;
      }
      .chart.tall {
        height: 340px;
      }
      .chart.short {
        height: 200px;
      }
      input.f {
        width: 72px;
        background: var(--input-bg);
        border: 0;
        border-bottom: 1px solid var(--amber-dim);
        color: var(--input);
        text-align: right;
        padding: 1px 4px;
      }
      input.f.w {
        width: 90px;
      }
      select.f {
        background: var(--input-bg);
        border: 1px solid var(--amber-dim);
        color: var(--input);
        padding: 1px 4px;
      }
      .heat td {
        color: #fff;
        font-weight: 500;
      }
      .heat td.lbl,
      .heat th {
        color: var(--amber);
      }
      .pill {
        display: inline-block;
        border: 1px solid var(--rule);
        padding: 0 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .list {
        margin: 0;
        padding-left: 18px;
      }
      .list li {
        margin: 3px 0;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 2px;
        vertical-align: middle;
        margin-right: 5px;
      }
      @media (max-width: 700px) {
        .box table {
          display: block;
          overflow-x: auto;
        }
        .big {
          font-size: 22px;
        }
      }
      .kv > * {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .box h2 {
        flex-wrap: wrap;
      }
      .pv {
        display: inline-block;
        font: 600 9px/1.4 var(--mono);
        margin-left: 3px;
        padding: 0 3px;
        border: 1px solid currentColor;
        vertical-align: 1px;
        cursor: help;
      }
      .pv.s {
        color: var(--up);
      }
      .pv.d {
        color: var(--blue);
      }
      .pv.a {
        color: var(--warn);
      }
      .pv.u {
        color: var(--muted);
      }
      .log {
        font-size: 12px;
        max-height: 260px;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--rule);
        padding: 6px 8px;
      }
      .log div {
        white-space: pre-wrap;
      }
      .log .ok {
        color: var(--up);
      }
      .log .err {
        color: var(--down);
      }
      footer {
        margin-top: 14px;
        color: var(--muted);
        font-size: 11px;
        border-top: 1px solid var(--rule);
        padding-top: 8px;
      }

      /* static hosting: let wide tables scroll inside their panel */
      main section.box {
        min-width: 0;
        overflow-x: auto;
      }
      .site-links {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 999;
        display: flex;
        gap: 8px;
      }
      .site-links a {
        font: 600 12px/1 var(--mono);
        background: var(--bg);
        color: var(--amber);
        border: 1px solid var(--amber);
        padding: 9px 12px;
        text-decoration: none;
        border-radius: 2px;
      }
    </style>
  </head>

ated":["DELL"],"pos":0,"neg":0,"tone":0.0},{"title":"Dell (DELL): A Top 10 Cheap AI Stock Trading at 13x Forward Earnings","publisher":"Insider Monkey","time":1793731993,"related":["DELL","INTC","^KS11","GOOG","AMZN"],"pos":0,"neg":0,"tone":0.0},{"title":"Super Micro Fell 7% on a Memory Shortage Warning. Its Margin Has to Answer November 3","publisher":"TIKR","time":1793729441,"related":["SMCI","INTC","DELL"],"pos":0,"neg":2,"tone":-1.0}]},"short":{"score":0.12478885527615706,"facts":["4.2% of the float sold short, -10% on the month"]}},"coverage":1.0,"lexicon":"built-in headline list"}}</script>
    <script>
      const DATA = JSON.parse(document.getElementById("valuation-data").textContent);
    </script>
    <script>
      "use strict";
      const M = window.VModel;
      const CY = window.VCycle;
      const TABS = [
        ["LOAD", "Research a ticker"],
        ["DES", "Summary"],
        ["VAL", "5-step valuation"],
        ["FA", "Financials"],
        ["EQ", "Earnings quality"],
        ["EE", "Estimates"],
        ["MODEL", "Segment model"],
        ["WACC", "Cost of capital"],
        ["BETA", "Beta regression"],
        ["DCF", "DCF"],
        ["SENS", "Sensitivity"],
        ["MC", "Monte Carlo"],
        ["CYC", "Cycle model"],
        ["RV", "Relative value"],
        ["ANR", "Street"],
        ["FFLD", "Football field"],
        ["AUD", "Audit inputs"],
        ["SRC", "Sources"],
      ];
      const RS = window.VResearch;
      // ---- companies: one worked example ships with the page; every researched ticker is saved in this browser
      const CO = { list: {}, active: "builtin" };
      const STORE = (key) => `${key}_${DATA.meta.ticker}`; // one page per company on the same site
      try {
        CO.list = JSON.parse(localStorage.getItem(STORE("vt_companies")) || "{}");
      } catch (e) {
        CO.list = {};
      }
      try {
        const a = localStorage.getItem(STORE("vt_active"));
        if (a && (a === "builtin" || CO.list[a])) CO.active = a;
      } catch (e) {}
      const companyData = (t) => (t === "builtin" ? DATA : CO.list[t]);
      function saveCompanies() {
        try {
          localStorage.setItem(STORE("vt_companies"), JSON.stringify(CO.list));
          localStorage.setItem(STORE("vt_active"), CO.active);
        } catch (e) {}
      }
      // the cycle tab exists only for a company whose inputs carry a cycle block
      const tabOk = (t) => t !== "CYC" || !!(CY && S.inp.cycle);
      const S = {
        inp: M.clone(companyData(CO.active) || DATA),
        scen: "Base",
        tab: "DES",
        mc: null,
        mcKey: "",
        charts: {},
      };
      try {
        const t = localStorage.getItem(STORE("vt_tab"));
        if (t && TABS.some((x) => x[0] === t) && tabOk(t)) S.tab = t;
      } catch (e) {}
      if (
        location.hash &&
        TABS.some((x) => x[0] === location.hash.slice(1).toUpperCase()) &&
        tabOk(location.hash.slice(1).toUpperCase())
      )
        S.tab = location.hash.slice(1).toUpperCase();

      // ---------------------------------------------------------------- format
      const $ = (id) => document.getElementById(id);
      const f0 = (x) =>
        x == null || !isFinite(x) ? "—" : x.toLocaleString("en-US", { maximumFractionDigits: 0 });
      const f1 = (x) =>
        x == null || !isFinite(x)
          ? "—"
          : x.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const f2 = (x) =>
        x == null || !isFinite(x)
          ? "—"
          : x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const px = (x) => (x == null || !isFinite(x) ? "—" : "$" + f2(x));
      const pct = (x, d = 1) => (x == null || !isFinite(x) ? "—" : (x * 100).toFixed(d) + "%");
      const spct = (x, d = 1) =>
        x == null || !isFinite(x) ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
      const bn = (x) => (x == null || !isFinite(x) ? "—" : "$" + (x / 1000).toFixed(1) + "B");
      const mx = (x) => (x == null || !isFinite(x) ? "—" : x.toFixed(1) + "x");
      const cls = (x) => (x > 0 ? "up" : x < 0 ? "down" : "");
      const get = (o, p) => p.split(".").reduce((a, k) => a[k], o);
      const set = (o, p, v) => {
        const ks = p.split(".");
        const last = ks.pop();
        ks.reduce((a, k) => a[k], o)[last] = v;
      };

      const UI = () =>
        Object.assign({ key_segment_label: "Key segment", key_margin_label: "key margin" }, S.inp.ui || {});
      const KS = () => M.keySeg(S.inp),
        KM = () => M.keyMargin(S.inp);
      const Y = (i) => S.inp.meta.year_labels[i];
      const segName = (k) => (M.defs(S.inp).find((d) => d.key === k) || { name: k }).name;
      const mgName = (g) => (S.inp.margin_groups || {})[g] || g;
      // editable field: data-p = path in S.inp, data-k = pct | num
      function fld(path, kind = "pct", w = "", dec) {
        const v = get(S.inp, path);
        const d = dec != null ? dec : kind === "pct" ? 2 : 2;
        const miss = typeof v !== "number" || !isFinite(v);
        const shown = miss ? "" : kind === "pct" ? (v * 100).toFixed(d) : Number(v).toFixed(d);
        return `<input type="text" class="f ${w}${miss ? " miss" : ""}" data-p="${path}" placeholder="${miss ? "missing" : ""}" data-k="${kind}" value="${shown}" inputmode="decimal" aria-label="${path}">${kind === "pct" ? '<span class="mut">%</span>' : ""}${pv(path)}`;
      }
      // provenance badge: S = sourced from a filing or data feed, D = derived from sourced numbers, A = assumption
      function pv(path) {
        const p = (S.inp.provenance || {})[path];
        if (!p) return `<span class="pv u" title="No source recorded">?</span>`;
        const k = p[0] === "sourced" ? "s" : p[0] === "derived" ? "d" : "a";
        return `<span class="pv ${k}" title="${String(p[1]).replace(/"/g, "&quot;")}">${k.toUpperCase()}</span>`;
      }

      // ---------------------------------------------------------------- compute
      function compute() {
        const inp = S.inp,
          scen = inp.scenarios[S.scen];
        const Q = M.checkInputs(inp);
        if (!Q.ok) return { blocked: Q, ver: M.verdict(inp, {}) };
        const W = M.wacc(inp);
        const base = M.dcf(inp, scen);
        const scen3 = {};
        for (const k of Object.keys(inp.scenarios)) scen3[k] = M.dcf(inp, inp.scenarios[k]);
        const rel = M.relative(inp);
        const rows = base.rows;
        const sg = inp.relative && inp.relative.subject_growth;
        const egr = sg != null && isFinite(sg) ? sg : Math.pow(rows[3].epsAdj / rows[0].epsAdj, 1 / 3) - 1;
        const reg = inp.model === "ddm" ? { implied: NaN, n: 0, points: [] } : M.regression(inp, egr);
        const key = JSON.stringify([inp, S.scen]);
        if (S.mcKey !== key) {
          S.mc = M.monteCarlo(inp, scen, { n: 1500, seed: 7 });
          S.mcKey = key;
        }
        const mc = S.mc;
        const ver = M.verdict(inp, {
          dcf: base.perShare,
          mc: mc.median,
          comps: rel.blended,
          regression: reg.implied,
        });
        if (reg.weak && isFinite(reg.r2))
          (ver.warnings = ver.warnings.filter((w) => w.path !== "verdict.weights.regression")),
            ver.warnings.push({
              path: "relative.reg_min_r2",
              msg: `Peer regression R² ${reg.r2.toFixed(2)} is below ${reg.minR2.toFixed(2)}; it is shown but left out of the blend`,
            });
        const w = W.wacc;
        if (M.isFin(inp)) {
          const k = W.ke,
            rev = {
              ke: M.reverse(inp, scen, "wacc", inp.terminal.g + 0.006, 0.3),
              g: M.reverse(inp, scen, "g", -0.05, k - 0.0005),
            };
          if (inp.model === "excess_return") {
            rev.roe = M.reverse(inp, scen, "roe_lr", -0.2, 0.8);
            rev.persist = M.reverse(inp, scen, "persistence", 0, 1);
          } else rev.dps = M.reverse(inp, scen, "dps_shift", -0.3, 0.3);
          return { W, base, scen3, rel, reg, mc, ver, rev, egr, pv: M.pvgo(inp), checks: Q };
        }
        const rev = {
          wacc: M.reverse(inp, scen, "wacc", 0.04, 0.25),
          margin: M.reverse(inp, scen, "margin_shift", -0.15, 0.3),
          ai: M.reverse(inp, scen, "ai_shift", -0.6, 3),
          all: M.reverse(inp, scen, "all_growth_shift", -0.3, 0.5),
          g: M.reverse(inp, scen, "g", -0.05, w - 0.0005),
        };
        if (isFinite(rev.margin)) {
          const k = M.applyKnob(inp, scen, "margin_shift", rev.margin);
          rev.marginEbit = M.dcf(k.I, k.S).rows[4].margin;
        }
        return { W, base, scen3, rel, reg, mc, ver, rev, egr, pv: M.pvgo(inp), checks: Q };
      }

      // ---------------------------------------------------------------- header
      function renderHeader(R) {
        const m = S.inp.market,
          ch = m.price - m.prev_close,
          chp = ch / m.prev_close;
        const sh = M.dilutedShares(S.inp);
        const v = R.ver;
        const chip =
          v.call === "OVERVALUED"
            ? "over"
            : v.call === "UNDERVALUED"
              ? "under"
              : v.call === "NOT VALUED" || v.call === "NO CALL"
                ? "nv"
                : "fair";
        const eqg = v.quality ? v.quality.grade : "n/a";
        const eqBadge = `<a href="#EQ" data-tab="EQ" title="Earnings quality grade${v.confidence === "low" ? ": low confidence" : ""}" style="margin-left:6px;font:600 11px var(--mono);color:${GRADE_COL[eqg]};border:1px solid currentColor;padding:0 4px;text-decoration:none">EQ ${eqg}</a>`;
        const nz = (x, f) => (typeof x === "number" && isFinite(x) ? f(x) : "—");
        if (R.blocked)
          $("quote").innerHTML = `
    <div class="tkr"><div class="k">${S.inp.meta.ticker} US Equity</div><div class="v">${nz(m.price, px)}</div></div>
    <div><div class="k">Call</div><div class="v"><span class="chip nv">NOT VALUED</span></div></div>
    <div><div class="k">Blocking inputs</div><div class="v neg">${R.blocked.blocking.length}</div></div>
    <div><div class="k">Street median</div><div class="v">${nz(S.inp.consensus.targets.median, px)}</div></div>`;
        else
          $("quote").innerHTML = `
    <div class="tkr"><div class="k">${S.inp.meta.ticker} US Equity</div><div class="v">${px(m.price)} <span class="${cls(ch)}" style="font-size:13px">${ch.toFixed(2)} ${spct(chp, 2)}</span></div></div>
    <div><div class="k">Mkt cap (dil.)</div><div class="v">${bn(m.price * sh)}</div></div>
    <div><div class="k">Fair value</div><div class="v">${px(v.fair)}</div></div>
    <div><div class="k">Upside</div><div class="v ${cls(v.upside)}">${spct(v.upside)}</div></div>
    <div><div class="k">Call (±${pct(S.inp.verdict.band, 0)})${v.confidence === "low" ? " · low confidence" : ""}</div><div class="v"><span class="chip ${chip}">${v.call}</span>${eqBadge}</div></div>
    <div><div class="k">Exp. alpha 1y</div><div class="v ${cls(v.alpha)}">${spct(v.alpha)}</div></div>
    ${
      M.isFin(S.inp)
        ? `<div><div class="k">Ke (${S.inp.model === "ddm" ? "DDM" : "excess return"})</div><div class="v">${pct(R.W.ke, 2)}</div></div>`
        : `<div><div class="k">WACC / Ke</div><div class="v">${pct(R.W.wacc, 2)} / ${pct(R.W.ke, 2)}</div></div>`
    }
    <div><div class="k">Street median</div><div class="v">${px(S.inp.consensus.targets.median)}</div></div>`;
        $("cmdInput").placeholder =
          `${S.inp.meta.ticker} US Equity  ${S.tab} <GO>   (type DCF, WACC, RV, ANR…)`;
        $("asof").textContent = `Px ${S.inp.meta.price_date} · BS ${S.inp.meta.balance_sheet_date} · USD m`;
        const cos = ["builtin", ...Object.keys(CO.list)];
        $("coSel").innerHTML = cos
          .map(
            (t) =>
              `<option value="${t}" ${t === CO.active ? "selected" : ""}>${t === "builtin" ? DATA.meta.ticker + " · published valuation" : t}</option>`,
          )
          .join("");
        $("scenSeg").innerHTML = Object.keys(S.inp.scenarios)
          .map((k) => `<button type="button" data-scen="${k}" aria-pressed="${k === S.scen}">${k}</button>`)
          .join("");
        const finLab = M.isFin(S.inp)
          ? {
              MODEL: S.inp.model === "ddm" ? "Dividend model" : "ROE model",
              DCF: S.inp.model === "ddm" ? "DDM" : "Excess return",
            }
          : {};
        $("fkeys").innerHTML = TABS.filter(([c]) => tabOk(c))
          .map(([c, n0], i) => {
            const n = finLab[c] || n0;
            return `<button type="button" role="tab" data-tab="${c}" aria-selected="${c === S.tab}">${c}<small>${n}</small></button>`;
          })
          .join("");
      }

      // ---------------------------------------------------------------- charts
      const HAS_CHART = typeof Chart !== "undefined";
      if (HAS_CHART) {
        Chart.defaults.color = "#8b9099";
        Chart.defaults.borderColor = "#262b33";
        Chart.defaults.font.family = '"IBM Plex Mono", ui-monospace, monospace';
        Chart.defaults.font.size = 11;
      }
      const vlines = {
        id: "vlines",
        afterDatasetsDraw(chart, _a, opts) {
          if (!opts || !opts.lines) return;
          const { ctx, chartArea: a } = chart,
            xs = chart.scales.x,
            ys = chart.scales.y;
          for (const L of opts.lines) {
            ctx.save();
            ctx.strokeStyle = L.color;
            ctx.lineWidth = L.width || 1.5;
            ctx.setLineDash(L.dash || []);
            ctx.beginPath();
            if (L.axis === "y") {
              const y = ys.getPixelForValue(L.value);
              ctx.moveTo(a.left, y);
              ctx.lineTo(a.right, y);
            } else {
              const x = xs.getPixelForValue(L.value);
              ctx.moveTo(x, a.top);
              ctx.lineTo(x, a.bottom);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = L.color;
            ctx.font = '11px "IBM Plex Mono", monospace';
            if (L.axis === "y") ctx.fillText(L.label, a.left + 4, ys.getPixelForValue(L.value) - 4);
            else
              ctx.fillText(
                L.label,
                Math.min(xs.getPixelForValue(L.value) + 4, a.right - ctx.measureText(L.label).width - 2),
                a.top + 12 + (L.row || 0) * 13,
              );
            ctx.restore();
          }
        },
      };
      if (HAS_CHART) Chart.register(vlines);
      function chart(id, cfg) {
        if (S.charts[id]) S.charts[id].destroy();
        const el = $(id);
        if (!el) return;
        if (!HAS_CHART) {
          el.parentNode.innerHTML =
            '<p class="note">Chart library did not load; the numbers in the tables are unaffected.</p>';
          return;
        }
        cfg.options = Object.assign(
          { responsive: true, maintainAspectRatio: false, animation: false },
          cfg.options || {},
        );
        S.charts[id] = new Chart(el, cfg);
      }
      function floatBars(id, items, lines, xmin, xmax) {
        chart(id, {
          type: "bar",
          data: {
            labels: items.map((d) => d.label),
            datasets: [
              {
                data: items.map((d) => [d.lo, d.hi]),
                backgroundColor: items.map((d) => d.color || "#2f6db3"),
                borderWidth: 0,
                barPercentage: 0.7,
              },
            ],
          },
          options: {
            indexAxis: "y",
            plugins: {
              legend: { display: false },
              vlines: { lines },
              tooltip: { callbacks: { label: (c) => `${px(c.raw[0])} – ${px(c.raw[1])}` } },
            },
            scales: {
              x: { min: xmin, max: xmax, ticks: { callback: (v) => "$" + v } },
              y: { ticks: { color: "#e9e7e2" } },
            },
          },
        });
      }

      // ---------------------------------------------------------------- tabs
      function ffItems(R) {
        if (M.isFin(S.inp)) return finFfItems(R);
        const I = S.inp,
          c = I.consensus.targets,
          m = I.market,
          sc = R.scen3,
          rt = R.rel.table;
        const w = R.W.wacc,
          scen = I.scenarios[S.scen];
        const g = M.sensitivity(I, scen, "wacc", [w - 0.01, w + 0.01], "g", [
          I.terminal.g - 0.005,
          I.terminal.g + 0.005,
        ]).flat();
        const I2 = M.clone(I);
        I2.terminal.method = "exit";
        const exits = [10, 14].map((k) => {
          const J = M.clone(I2);
          J.terminal.exit_multiple = k;
          return M.dcf(J, scen).perShare;
        });
        const regLo = M.regression(I, R.egr - 0.05).implied,
          regHi = M.regression(I, R.egr + 0.05).implied;
        return [
          { label: "52-week range", lo: m.low_52w, hi: m.high_52w, color: "#4b525c" },
          { label: "Street targets (low–high)", lo: c.low, hi: c.high, color: "#6b5a2a" },
          { label: "DCF bear–bull", lo: sc.Bear.perShare, hi: sc.Bull.perShare, color: "#2f6db3" },
          { label: "DCF WACC ±1pp, g ±0.5pp", lo: Math.min(...g), hi: Math.max(...g), color: "#2f6db3" },
          {
            label: "DCF exit 10x–14x EBITDA",
            lo: Math.min(...exits),
            hi: Math.max(...exits),
            color: "#2f6db3",
          },
          { label: "Monte Carlo p10–p90", lo: R.mc.p10, hi: R.mc.p90, color: "#2a7f62" },
          ...Object.keys(rt)
            .filter((k) => rt[k].usable)
            .map((k) => ({
              label: `Comps ${{ pe_fwd: "fwd P/E", ev_ebitda: "EV/EBITDA", ev_sales: "EV/Sales" }[k] || k} (IQR)`,
              lo: Math.min(rt[k].impliedQ1, rt[k].impliedQ3),
              hi: Math.max(rt[k].impliedQ1, rt[k].impliedQ3),
              color: "#7a4fb3",
            })),
          {
            label: "P/E–growth regression ±5pp g",
            lo: Math.min(regLo, regHi),
            hi: Math.max(regLo, regHi),
            color: "#7a4fb3",
          },
        ];
      }
      function ffLines(R) {
        return [
          {
            value: S.inp.market.price,
            color: "#ff4d4d",
            dash: [5, 4],
            label: `Price ${px(S.inp.market.price)}`,
            row: 0,
          },

          cols = I.peers.columns,
          ix = (k) => cols.indexOf(k),
          c = I.capital;
        const st = c.beta_daily_stats;
        const step = (n, label, val, note) =>
          `<tr><td class="amb">${n}</td><td style="text-align:left;white-space:normal">${label}</td><td>${val}</td><td class="mut" style="text-align:left;white-space:normal">${note || ""}</td></tr>`;
        const betaOpts = [
          ["daily", "Daily regression vs S&P 500 (raw)"],

          ["crsp_monthly_adj", "CRSP monthly regression, adjusted"],
          ["blume", "Published 5Y, adjusted"],
          ["raw", "Published 5Y, raw"],
          ["bottom_up", "Bottom-up (peers)"],
          ["custom", "Custom"],
        ];
        const cst = c.beta_crsp_monthly_stats;
        return `
  <div class="title"><h1>WACC · Cost of capital</h1><div class="sub">Cost of equity built in six steps, then debt and weights</div></div>
  ${M.isFin(I) ? `<div class="dq"><b>${MODEL_NAME[I.model]}:</b> only the cost of equity (${pct(W.ke, 2)}) is used. Debt is part of the business, so the cost of debt and the WACC below are shown for reference and do not change the value.</div>` : ""}
  <div class="grid">
    <section class="box c8"><h2>Cost of equity <span>CAPM: Ke = rf + β × (Rm − rf) + CRP</span></h2><div class="scroll"><table>
      <thead><tr><th>Step</th><th class="l">Input</th><th>Value</th><th class="l">Source / note</th></tr></thead><tbody>

      ${step(2, "Expected return on the overall market (S&P 500), Rm", fld("capital.rm"), (I.notes && I.notes.rm) || "")}
      ${step(3, "Market risk premium = Rm − rf", `<b>${pct(W.mrp, 2)}</b>`, `${pct(W.rm, 2)} − ${pct(c.rf, 2)}`)}
      ${step(
        4,
        `Beta <select class="f" id="betaSrc" aria-label="Beta source">${betaOpts.map(([v, n]) => `<option value="${v}" ${c.beta_source === v ? "selected" : ""} ${(v.startsWith("daily") && b.daily == null) || (v.startsWith("crsp") && b.crsp == null) ? "disabled" : ""}>${n}</option>`).join("")}</select>`,
        `<b>${b.chosen.toFixed(3)}</b>`,

      ${step("+", "Country risk premium (0 for the US)", fld("capital.crp"), "Damodaran CRP; add only for non-US exposure")}
      ${step(6, "Cost of equity = rf + β × MRP + CRP", `<b class="amb">${pct(W.ke, 2)}</b>`, `${pct(c.rf, 2)} + ${pct(W.equityPremium, 2)}${c.crp ? " + " + pct(c.crp, 2) : ""}`)}

      </div>
      <p class="note">WACC = ${pct(W.we)} × ${pct(W.ke, 2)} + ${pct(W.wd)} × ${pct(W.kd_after, 2)}</p></section>
    <section class="box"><h2>Cross-check: bottom-up beta <span>Hamada: βu = βl / (1 + (1−t)·D/E); median relevered at ${I.meta.ticker}'s D/E of ${pct(W.D / W.E)}</span></h2><div class="scroll"><table>
      <thead><tr><th>Peer</th><th>Levered β</th><th>Mkt cap $m</th><th>Debt $m</th><th>D/E</th><th>Unlevered β</th></tr></thead><tbody>
      ${I.peers.core_set
        .map((tk, i) => {

        })
        .join("")}
      <tr class="sum"><td>Median unlevered → relevered for ${I.meta.ticker}</td><td></td><td></td><td></td><td></td><td>${bu.median.toFixed(3)} → ${bu.relevered.toFixed(3)}</td></tr>
      </tbody></table></div></section>
  </div>`;
      };

      RENDER.BETA = () => {
        const I = S.inp,
          st = I.capital.beta_daily_stats;

      <tr><td>R square</td><td>${fx(r.r2, 6)}</td></tr><tr><td>Multiple R</td><td>${fx(Math.sqrt(r.r2), 6)}</td></tr>

      <tr><td>Volatility: stock / index (ann.)</td><td>${r.volStock != null ? pct(r.volStock) + " / " + pct(r.volMkt) : "—"}</td></tr></tbody></table></div>`
            : `<p class="note">No regression yet.</p>`;
        return `
  <div class="title"><h1>BETA · Daily regression vs S&P 500</h1><div class="sub">R(${I.meta.ticker}) = α + β·R(S&P 500) + ε on daily returns</div></div>

    <section class="box c6"><h2>Load prices <span>Yahoo Finance → Historical Data → Download</span></h2>

      </div>
      <p class="note">Uses Adj Close when the file has it, otherwise Close. Dates are matched across the two files before returns are taken, so holidays and gaps don't shift the series. A CSV with just Date and Close columns also works. Run <code>python beta_daily.py DELL</code> on your laptop to do the same with yfinance and save it into the inputs file.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="btn" type="button" id="bRun">Run regression</button>
        <button class="btn" type="button" id="bUseRaw" ${st ? "" : "disabled"}>Use raw β in WACC</button>
        <button class="btn" type="button" id="bUseAdj" ${st ? "" : "disabled"}>Use adjusted β in WACC</button>
      </div>
      <p class="note" id="bMsg"></p></section>
    <section class="box c6"><h2>Summary output</h2>${res(st)}</section>
    <section class="box"><h2>Scatter <span>daily returns</span></h2><div class="chart"><canvas id="cBeta"></canvas></div></section>
    ${
      st && st.robustness
        ? `<section class="box c6"><h2>Robustness <span>does the beta survive other windows and data choices?</span></h2><div class="scroll"><table><thead><tr><th>Specification</th><th>β</th><th>SE</th><th>n</th></tr></thead><tbody>
      ${st.robustness.map(([n, b, se, k]) => `<tr><td>${n}</td><td>${b.toFixed(3)}</td><td>${se.toFixed(3)}</td><td>${k}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">Every specification lands near 2, so the high beta is not driven by a few extreme days. It reflects the 2025–26 AI-server regime and is rising (year 2 above year 1). The WACC uses the adjusted beta (0.67β + 0.33) because raw betas this far from 1 tend to drift back toward the market.</p></section>`
        : ""
    }

      I.capital.beta_crsp_monthly_stats

        : ""
    }
    ${
      I.peers.crsp_monthly_beta
        ? `<section class="box c6"><h2>Peer betas, same CRSP window</h2><div class="scroll"><table><thead><tr><th>Ticker</th><th>β</th><th>SE</th><th>R²</th><th>n</th><th>Adjusted</th></tr></thead><tbody>
      ${Object.entries(I.peers.crsp_monthly_beta)
        .map(
          ([t, r]) =>
            `<tr><td>${t}</td><td>${fx(r.beta, 3)}</td><td>${fx(r.seBeta, 3)}</td><td>${fx(r.r2, 3)}</td><td>${r.n}</td><td>${fx(r.blume, 3)}</td></tr>`,
        )
        .join("")}
      </tbody></table></div><p class="note">Monthly returns understate co-movement less than daily ones for thinly traded stocks but carry fewer observations, so standard errors are wider. A daily two-year regression is the primary estimate; this is the cross-check.</p></section>`
        : ""
    }
  </div>`;
      };
      RENDER.BETA.after = () => {
        const readCSV = (file) =>
          new Promise((ok, bad) => {
            const fr = new FileReader();
            fr.onerror = () => bad(new Error("could not read " + file.name));
            fr.onload = () => ok(fr.result);
            fr.readAsText(file);
          });
        const toISO = (d) => {
          d = d.trim().replace(/"/g, "");
          if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0, 10);
          const t = new Date(d);
          if (isNaN(t)) return null;
          return (
            t.getFullYear() +
            "-" +
            String(t.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(t.getDate()).padStart(2, "0")
          );
        };
        const parse = (txt) => {
          const lines = txt.trim().split(/\r?\n/),
            head = lines[0].split(",").map((h) => h.trim().replace(/"/g, "").toLowerCase());
          let ci = head.indexOf("adj close");
          if (ci < 0) ci = head.indexOf("close");
          if (ci < 0) ci = 1;
          const di = Math.max(0, head.indexOf("date"));
          const out = [];
          for (const ln of lines.slice(1)) {
            const p = ln.split(","),
              d = toISO(p[di] || ""),
              v = parseFloat((p[ci] || "").replace(/[$"]/g, ""));
            if (d && isFinite(v) && v > 0) out.push([d, v]);
          }
          return out.sort((a, b) => (a[0] < b[0] ? -1 : 1));
        };
        const st = S.inp.capital.beta_daily_stats;
        if (st && st.points)
          chart("cBeta", {
            type: "scatter",
            data: {
              datasets: [
                {
                  data: st.points.map(([x, y]) => ({ x: x * 100, y: y * 100 })),
                  backgroundColor: "rgba(74,163,255,.45)",
                  pointRadius: 2,
                },
                {
                  data: [
                    { x: st.xmin * 100, y: (st.alpha + st.beta * st.xmin) * 100 },
                    { x: st.xmax * 100, y: (st.alpha + st.beta * st.xmax) * 100 },

                  type: "line",
                  borderColor: "#ffa028",
                  pointRadius: 0,

          try {
            const [a, b] = await Promise.all([readCSV(fs), readCSV(fi)]);
            const sp = parse(a),
              ip = parse(b),
              win = parseInt($("bWin").value, 10);
            let { rs, rm, dates } = M.returnsFromPrices(sp, ip);
            if (win > 0 && rs.length > win) {
              rs = rs.slice(-win);
              rm = rm.slice(-win);
              dates = dates.slice(-win);
            }
            if (rs.length < 30) {
              $("bMsg").textContent =
                `Only ${rs.length} matching days. Check that both files cover the same dates.`;
              return;
            }
            const r = M.capmBeta(rs, rm);
            r.window = `${dates[0]} to ${dates[dates.length - 1]}`;
            const step = Math.max(1, Math.floor(rs.length / 600));
            r.points = rs.map((y, i) => [rm[i], y]).filter((_, i) => i % step === 0);
            r.xmin = Math.min(...rm);
            r.xmax = Math.max(...rm);
            S.inp.capital.beta_daily = r.beta;
            S.inp.capital.beta_daily_stats = r;
            render();
          } catch (e) {
            $("bMsg").textContent = e.message;
          }
        });
        const use = (src) => {
          S.inp.capital.beta_source = src;

        $("bUseAdj").addEventListener("click", () => use("daily_adj"));
        if ($("bUseCrsp")) {

      <thead><tr><th></th>${hist.map((h) => `<th>${h.l}A</th>`).join("")}${rows.map((r) => `<th>${r.label}E</th>`).join("")}</tr></thead><tbody>

      <span><b class="amb">WACC</b></span><span><b>${pct(W.wacc, 2)}</b></span></div>

      <tr><td>FCFF counted</td>${rows.map((r) => `<td>${f0(r.fcff * r.frac)}</td>`).join("")}<td>${f0(b.tv)}</td></tr>

      <tr class="sum"><td>Present value</td>${rows.map((r) => `<td>${f0(r.pv)}</td>`).join("")}<td>${f0(b.pvTV)}</td></tr>
      </tbody></table></div>
      <div class="kv" style="margin-top:8px"><span>Sum of PV, ${rows[0].label}–${rows[rows.length - 1].label}</span><span>${f0(b.pvExplicit)}</span>
      <span>+ PV of terminal value (g ${pct(I.terminal.g, 1)}, ${I.terminal.method === "exit" ? I.terminal.exit_multiple + "x EBITDA" : "RONIC " + pct(I.terminal.ronic, 0)})</span><span>${f0(b.pvTV)}</span>
      <span><b class="amb">= Enterprise value</b></span><span><b>${f0(b.ev)}</b></span></div>
      <p class="note">${rows[0].label} counts only the ${pct(rows[0].frac, 0)} of the year not already in the ${I.meta.balance_sheet_date} balance sheet.</p></section>
    <section class="box c6"><h2>4 · Enterprise value → market cap <span>deduct debt, add cash</span></h2><div class="kv">
      <span>Enterprise value</span><span>${f0(b.ev)}</span>
      <span>− Debt (core debt ${f0(br.core_debt)} + leases ${f0(br.leases)})</span><span>${f0(-debt)}</span>

      <span><b class="amb">= Estimated market cap (equity value)</b></span><span><b>${f0(b.equity)}</b></span>

      <span>Difference</span><span class="${cls(b.equity / mcapNow - 1)}">${spct(b.equity / mcapNow - 1)}</span></div>
      ${b.dfsNet ? `<p class="note">${S.inp.meta.name}'s financing-arm debt (${f0(br.dfs_debt)}) is not deducted with the other debt because it is matched by customer financing receivables; the arm is added at its net book value instead. Deducting all debt and ignoring those receivables would understate value by about ${px((br.dfs_receivables + br.dfs_lease_equipment) / sh)} a share.</p>` : ""}</section>

      <span>Estimated market cap</span><span>${f0(b.equity)}</span>
      <span>÷ Diluted shares (m)</span><span>${f2(sh)}</span>
      <span><b class="amb">= Fair share price (DCF, ${S.scen})</b></span><span class="big amb">${px(b.perShare)}</span>
      <span>Current share price</span><span>${px(m.price)}</span>
      <span>Upside / (downside)</span><span class="${cls(b.perShare / m.price - 1)}"><b>${spct(b.perShare / m.price - 1)}</b></span></div>
      <p class="note">This is the DCF answer alone. The DES summary blends it with Monte Carlo, comps and the P/E regression into the overall verdict (${px(R.ver.fair)}, ${R.ver.call.toLowerCase()}).</p></section>
  </div>`;
      };

      RENDER.DCF = (R) => {
        const I = S.inp,
          b = R.base,
          rows = b.rows;
        const col = (f) => rows.map((r) => `<td>${f(r)}</td>`).join("");
        return `
  <div class="title"><h1>DCF · Discounted free cash flow — ${S.scen}</h1><div class="sub">${I.timing.mid_year ? "Mid-year convention" : "Year-end discounting"} · first-year stub ${pct(I.timing.stub, 1)} of ${Y(0)} FCF · WACC ${pct(b.wacc, 2)}</div></div>
  <div class="grid">
    <section class="box c4"><h2>Terminal value</h2><div class="kv">
      <span>Method used</span><span><select class="f" id="tvMethod" aria-label="Terminal method"><option value="gordon" ${I.terminal.method === "gordon" ? "selected" : ""}>Perpetuity (value driver)</option><option value="exit" ${I.terminal.method === "exit" ? "selected" : ""}>Exit EV/EBITDA</option></select></span>
      <span>Terminal growth g</span><span>${fld("terminal.g")}</span>
      <span>Return on new invested capital</span><span>${fld("terminal.ronic", "pct", "", 1)}</span>
      <span>Exit EV/EBITDA multiple</span><span>${fld("terminal.exit_multiple", "num", "", 1)}</span>
      <span>Perpetuity TV → implied EV/EBITDA</span><span>${mx(b.impliedExitMultiple)}</span>
      <span>Exit TV → implied perpetual g</span><span>${pct(b.impliedGFromExit, 2)}</span></div>
      <p class="note">Perpetuity FCF = NOPAT × (1+g) × (1 − g/RONIC): growth needs reinvestment, so g and RONIC are set together rather than plugged.</p></section>
    <section class="box c4"><h2>Enterprise → equity bridge <span>$m</span></h2><div class="kv">
      <span>PV of FCF ${Y(0)} stub–${Y(9)}</span><span>${f0(b.pvExplicit)}</span>
      <span>PV of terminal value</span><span>${f0(b.pvTV)}</span>
      <span><b class="amb">Enterprise value</b></span><span><b>${f0(b.ev)}</b></span>
      <span>+ Cash</span><span>${f0(I.bridge.cash)}</span>
      <span>− Core debt</span><span>${f0(-I.bridge.core_debt)}</span>
      <span>− Operating leases</span><span>${f0(-I.bridge.leases)}</span>
      ${b.dfsNet ? `<span>+ Captive-finance net assets (receivables + leases − its debt)</span><span>${f0(b.dfsNet)}</span>` : ""}
      <span>+ Strategic investments</span><span>${f0(I.bridge.investments)}</span>
      <span><b class="amb">Equity value</b></span><span><b>${f0(b.equity)}</b></span>
      <span>÷ Diluted shares (m)</span><span>${f2(M.dilutedShares(I))}</span>
      <span><b class="amb">Value per share</b></span><span><b>${px(b.perShare)}</b></span></div></section>
    <section class="box c4"><h2>Checks</h2><div class="kv">
      <span>TV share of EV</span><span>${pct(b.tvShare)}</span>
      <span>Per share, perpetuity TV</span><span>${px(b.perShareGordon)}</span>
      <span>Per share, exit-multiple TV</span><span>${px(b.perShareExit)}</span>
      <span>Value / ${Y(1)} non-GAAP EPS</span><span>${mx(b.perShare / rows[1].epsAdj)}</span>
      <span>EV / ${Y(1)} EBITDA</span><span>${mx(b.ev / rows[1].ebitda)}</span>
      <span>Terminal g vs risk-free</span><span class="${I.terminal.g > I.capital.rf ? "down" : "up"}">${I.terminal.g > I.capital.rf ? "g above rf — check" : "g ≤ rf"}</span></div></section>
    <section class="box"><h2>Discounting <span>$m</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${rows.map((r) => `<th>${r.label}</th>`).join("")}</tr></thead><tbody>
      <tr><td>Unlevered FCF (full year)</td>${col((r) => f0(r.fcff))}</tr>
      <tr><td>Fraction counted</td>${col((r) => r.frac.toFixed(3))}</tr>
      <tr><td>Discount period (years)</td>${col((r) => r.t.toFixed(3))}</tr>
      <tr><td>Discount factor</td>${col((r) => r.df.toFixed(4))}</tr>
      <tr class="sum"><td>PV of FCF</td>${col((r) => f0(r.pv))}</tr></tbody></table></div></section>
  </div>`;
      };

      function heat(grid, rowsV, colsV, rf, cf, price, cur) {
        const flat = grid.flat().filter(isFinite),
          lo = Math.min(...flat),
          hi = Math.max(...flat);
        const color = (v) => {
          if (!isFinite(v)) return "#262b33";
          const t = (v - price) / Math.max(price - lo, hi - price, 1);
          const a = Math.min(1, Math.abs(t));
          return t < 0 ? `rgba(255,77,77,${0.25 + 0.65 * a})` : `rgba(61,220,132,${0.25 + 0.65 * a})`;
        };
        return `<div class="scroll"><table class="heat"><thead><tr><th></th>${colsV.map((c) => `<th>${cf(c)}</th>`).join("")}</tr></thead><tbody>
    ${grid.map((r, i) => `<tr><td class="lbl">${rf(rowsV[i])}</td>${r.map((v, j) => `<td style="background:${color(v)};${cur && cur[0] === i && cur[1] === j ? "outline:2px solid #ffa028;outline-offset:-2px" : ""}">${isFinite(v) ? f0(v) : "—"}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`;
      }

      RENDER.SENS = (R) => {
        const I = S.inp,
          sc = I.scenarios[S.scen],
          w = R.W.wacc,
          p = I.market.price;
        const ws = [-0.02, -0.01, 0, 0.01, 0.02].map((d) => w + d);
        const gs = [0.02, 0.025, 0.03, 0.035, 0.04];
        const g1 = M.sensitivity(I, sc, "wacc", ws, "g", gs);
        const I2 = M.clone(I);
        I2.terminal.method = "exit";
        const ms = [8, 10, 12, 14, 16];
        const g2 = M.sensitivity(I2, sc, "wacc", ws, "exit_multiple", ms);
        const a0 = sc.growth[KS()][0],
          c0 = sc.margins[KM()][1];
        const ai = [-0.35, -0.2, 0, 0.2, 0.4].map((d) => a0 + d),
          cm = [-0.04, -0.02, 0, 0.02, 0.04].map((d) => c0 + d);
        const g3 = M.sensitivity(I, sc, "ai_fy28", ai, "core_margin_lr", cm);
        const gi = gs.indexOf(I.terminal.g);
        return `
  <div class="title"><h1>SENS · Sensitivity — ${S.scen}</h1><div class="sub">$ per share · green above price ${px(p)}, red below · amber box = current inputs</div></div>
  <div class="grid">
    <section class="box c6"><h2>WACC × terminal growth <span>perpetuity TV</span></h2>${heat(
      g1,
      ws,
      gs,
      (x) => pct(x, 2),
      (x) => pct(x, 1),
      p,
      gi >= 0 ? [2, gi] : null,
    )}</section>
    <section class="box c6"><h2>WACC × exit EV/EBITDA <span>exit-multiple TV</span></h2>${heat(
      g2,
      ws,
      ms,
      (x) => pct(x, 2),
      (x) => x + "x",
      p,
      null,
    )}</section>
    <section class="box c6"><h2>${Y(1)} ${UI().key_segment_label} growth × long-run ${UI().key_margin_label} margin</h2>${heat(
      g3,
      ai,
      cm,
      (x) => pct(x, 0),
      (x) => pct(x, 0),
      p,
      [2],
    )}</section>
    <section class="box c6"><h2>Tornado <span>value per share at low / high input</span></h2><div class="chart tall"><canvas id="cTor"></canvas></div></section>
  </div>`;
      };
      RENDER.SENS.after = (R) => {
        const I = S.inp,
          w = R.W.wacc,
          sc = I.scenarios[S.scen];
        const T = M.tornado(I, sc, [
          ["WACC ±1pp", "wacc", w - 0.01, w + 0.01],
          ["Terminal g 2%–4%", "g", 0.02, 0.04],
          ["Long-run margins ±1.5pp", "margin_shift", -0.015, 0.015],
          [
            `${Y(1)} ${UI().key_segment_label} growth ±25pp`,
            "ai_fy28",
            sc.growth[KS()][0] - 0.25,
            sc.growth[KS()][0] + 0.25,
          ],
          [`All growth ${Y(1)}–${Y(4)} ±3pp`, "all_growth_shift", -0.03, 0.03],
          ["ERP 3.5%–5.5%", "erp", 0.035, 0.055],
          ["RONIC 12%–40%", "ronic", 0.12, 0.4],
          ["ΔNWC −12% to 0%", "nwc_pct", 0, -0.12],
          ["Capex 3.0%–1.8%", "capex_pct", 0.03, 0.018],
        ]);
        const base = T[0].base,
          allv = T.flatMap((t) => [t.lo, t.hi]).concat([base, I.market.price]);
        const tmin = Math.floor((Math.min(...allv) * 0.95) / 25) * 25,
          tmax = Math.ceil((Math.max(...allv) * 1.04) / 25) * 25;
        chart("cTor", {
          type: "bar",
          data: {
            labels: T.map((t) => t.label),
            datasets: [
              { label: "Low input", data: T.map((t) => [base, t.lo]), backgroundColor: "#ff4d4d" },
              { label: "High input", data: T.map((t) => [base, t.hi]), backgroundColor: "#3ddc84" },
            ],
          },
          options: {
            indexAxis: "y",
            plugins: {
              legend: { labels: { boxWidth: 10 } },
              vlines: {
                lines: [
                  { value: base, color: "#ffa028", label: `Base ${px(base)}` },
                  {
                    value: I.market.price,
                    color: "#e9e7e2",
                    dash: [4, 4],
                    label: `Price ${px(I.market.price)}`,
                    row: 1,
                  },
                ],
              },
              tooltip: { callbacks: { label: (c) => px(c.raw[1]) } },
            },
            scales: {
              x: { min: tmin, max: tmax, stacked: false, ticks: { callback: (v) => "$" + v } },
              y: { stacked: true },
            },
          },
        });
      };

      RENDER.MC = (R) => {
        const mc = R.mc,
          I = S.inp;
        return `
  <div class="title"><h1>MC · Monte Carlo — ${S.scen}</h1><div class="sub">${f0(mc.n)} valid draws · seed 7 · reruns automatically when inputs change</div></div>
  <div class="grid">
    <section class="box c8"><h2>Distribution of value per share</h2><div class="chart tall"><canvas id="cMC"></canvas></div></section>
    <section class="box c4"><h2>Statistics</h2><div class="kv">
      <span>Mean</span><span>${px(mc.mean)}</span><span>Median</span><span>${px(mc.median)}</span>
      <span>5th / 95th pct</span><span>${px(mc.p5)} / ${px(mc.p95)}</span>
      <span>10th / 90th pct</span><span>${px(mc.p10)} / ${px(mc.p90)}</span>
      <span>25th / 75th pct</span><span>${px(mc.p25)} / ${px(mc.p75)}</span>
      <span><b class="amb">P(value &gt; price)</b></span><span><b>${pct(mc.probAbove)}</b></span></div>
      <h2 style="margin-top:14px">Shocks</h2>
      <ul class="list note">${
        M.isFin(I)
          ? (I.model === "excess_return"
              ? "<li>Long-run ROE: normal, sd 1.5pp</li><li>Year-1 ROE: normal, sd 1pp</li>"
              : "<li>Dividend growth, every year: normal, sd 1pp</li>") +
            "<li>Cost of equity: triangular, −1pp / base / +1.5pp</li><li>Terminal g: triangular 1.5% / base / 3.5%</li></ul></section></div>"
          : ""
      }${
        M.isFin(I)
          ? ""
          : `<li>${Y(1)} ${UI().key_segment_label} growth: normal, sd 12pp</li><li>All-segment growth ${Y(1)}–${Y(4)}: normal, sd 2pp</li>
      <li>Long-run ${UI().key_margin_label} margin: sd 2pp</li><li>Other margin groups: sd 1pp</li>
      <li>WACC: triangular, −1pp / base / +1.5pp</li><li>Terminal g: triangular 2% / base / 3.5%</li></ul></section>
  </div>`
      }`;
      };
      RENDER.MC.after = (R) => {
        const v = R.mc.values,
          lo = v[0],
          hi = v[v.length - 1],
          nb = 40,
          w = (hi - lo) / nb,
          p = S.inp.market.price;
        const bins = Array(nb).fill(0);
        v.forEach((x) => bins[Math.min(nb - 1, Math.floor((x - lo) / w))]++);
        const pts = bins.map((b, i) => ({ x: lo + (i + 0.5) * w, y: b }));
        chart("cMC", {
          type: "bar",
          data: {
            datasets: [
              {
                data: pts,
                backgroundColor: pts.map((d) => (d.x > p ? "#2a7f62" : "#2f6db3")),
                barPercentage: 1,
                categoryPercentage: 1,
              },
            ],
          },
          options: {
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { title: (c) => px(c[0].raw.x), label: (c) => c.raw.y + " draws" } },
              vlines: {
                lines: [
                  { value: p, color: "#ff4d4d", dash: [5, 4], label: `Price ${px(p)}` },
                  { value: R.mc.median, color: "#ffa028", label: `Median ${px(R.mc.median)}`, row: 1 },
                ],
              },
            },
            scales: {
              x: {
                type: "linear",
                min: lo,
                max: hi,
                offset: false,
                ticks: { callback: (x) => "$" + Math.round(x) },
              },
              y: { title: { display: true, text: "draws" } },
            },
          },
        });
      };

      // ---------------------------------------------------------------- CYC: cycle model (sliders re-value in the browser)
      const CY_SLIDERS = [
        ["extA", "Extra boom years after the Street's two", 0, 3, 1, (v) => v.toFixed(0)],
        ["LB", "Downturn and recovery length, years", 3, 6, 1, (v) => v.toFixed(0)],
        ["gB0", "Revenue growth, first downturn year", -0.45, 0, 0.01, (v) => pct(v, 0)],
        ["trough", "Trough EBIT margin", -0.1, 0.35, 0.01, (v) => pct(v, 0)],
        ["mid", "Mid-cycle EBIT margin", 0.1, 0.48, 0.01, (v) => pct(v, 0)],
        ["betaT", "Terminal unlevered beta", 1.2, 2.3, 0.05, (v) => v.toFixed(2)],
        ["excess", "Terminal ROIC above WACC", 0, 0.06, 0.005, (v) => pct(v, 1)],
      ];
      function cyState() {
        const c = S.inp.cycle;
        if (!S.cy || S.cy.src !== c) {
          const scen = c.scenarios.Base ? "Base" : Object.keys(c.scenarios)[0];
          S.cy = { src: c, scen, x: { ...c.scenarios[scen] }, mc: null, mcKey: "", main: null };
        }
        return S.cy;
      }
      const cyFY = (i) => {
        const y0 = parseInt(S.inp.meta.year_labels[0].replace(/\D/g, ""), 10);
        return "FY" + (y0 + i - 1);
      };
      function cyMC() {
        const st = cyState(),
          I = S.inp;
        const key = JSON.stringify([I.market, I.bridge, I.capital, I.operating, I.timing, I.rev_y0, I.cycle]);
        if (st.mcKey !== key) {
          st.mc = CY.monteCarlo(I, 5000, 7);
          st.mcKey = key;
        }
        return st.mc;
      }
      function cyCompute() {
        const st = cyState();
        try {
          return { v: CY.valueAt(st.x, S.inp), mid: CY.impliedMidMargin(st.x, S.inp, S.inp.market.price) };
        } catch (e) {
          return { err: e.message };
        }
      }
      function cyKv(o) {
        if (o.err)
          return `<p class="note">${o.err}. Lower the terminal beta or raise the discount rate inputs.</p>`;
        const v = o.v,
          p = S.inp.market.price,
          up = v.per_share / p - 1,
          n = v.n;
        return `<div class="kv">
      <span><b class="amb">Value per share</b></span><span><b>${px(v.per_share)}</b></span>
      <span>vs price ${px(p)}</span><span class="${cls(up)}">${spct(up)}</span>
      <span>Enterprise value</span><span>${f0(v.ev)}</span>
      <span>Terminal value share of EV</span><span>${pct(v.tv_share)}</span>
      <span>WACC, ${cyFY(1)} → ${cyFY(n)}</span><span>${pct(v.wacc[0], 2)} → ${pct(v.wacc[n - 1], 2)}</span>
      <span>ROIC, ${cyFY(n)}</span><span>${pct(v.roic[n - 1], 1)}</span>
      <span>Mid-cycle margin the price implies</span><span>${o.mid == null ? "—" : pct(o.mid, 1)}</span>
      <span>Main-model Base DCF</span><span>${px(cyState().main)}</span></div>`;
      }
      function cyTable(v) {
        const a = (f) => Array.from({ length: v.n }, (_, i) => `<td>${f(i)}</td>`).join("");
        const m = (x) => f0(Math.abs(x) < 0.5 ? 0 : x);
        return `<table><thead><tr><th></th>${Array.from({ length: v.n }, (_, i) => `<th>${cyFY(i + 1)}</th>`).join("")}</tr></thead><tbody>
      <tr><td>Revenue</td>${a((i) => f0(v.revenue[i]))}</tr>
      <tr><td>Growth</td>${a((i) => pct(v.growth[i], 0))}</tr>
      <tr><td>EBIT margin</td>${a((i) => pct(v.margin[i], 1))}</tr>
      <tr><td>NOPAT</td>${a((i) => m(v.nopat[i]))}</tr>
      <tr><td>Reinvestment</td>${a((i) => m(v.reinvestment[i]))}</tr>
      <tr><td>Free cash flow</td>${a((i) => m(v.fcff[i]))}</tr>
      <tr><td>WACC</td>${a((i) => pct(v.wacc[i], 2))}</tr>
      <tr><td>ROIC</td>${a((i) => pct(v.roic[i], 0))}</tr>
      <tr class="sum"><td>PV of free cash flow</td>${a((i) => m(v.pv[i]))}</tr></tbody></table>`;
      }
      function cyPaint(v) {
        const labels = Array.from({ length: v.n }, (_, i) => cyFY(i + 1));
        const data = {
          labels,
          datasets: [
            {
              type: "bar",
              label: "Revenue, $B",
              data: Array.from(v.revenue, (x) => x / 1000),
              backgroundColor: "#2f6db3",
              yAxisID: "y",
              order: 2,
            },
            {
              type: "line",
              label: "EBIT margin",
              data: Array.from(v.margin, (x) => x * 100),
              borderColor: "#ffa028",
              backgroundColor: "#ffa028",
              pointRadius: 2,
              yAxisID: "y1",
              order: 1,
            },
          ],
        };
        const c = S.charts.cCY;
        if (c) {
          c.data = data;
          c.update("none");
          return;
        }
        chart("cCY", {
          data,
          options: {
            plugins: { legend: { labels: { boxWidth: 10 } } },
            scales: {
              y: { title: { display: true, text: "revenue, $B" }, beginAtZero: true },
              y1: {
                position: "right",
                title: { display: true, text: "EBIT margin, %" },
                grid: { drawOnChartArea: false },
                ticks: { callback: (x) => x + "%" },
              },
            },
          },
        });
      }
      function cyUpdate() {
        const o = cyCompute(),
          st = cyState();
        $("cyKv").innerHTML = cyKv(o);
        for (const [k, , , , , fmt] of CY_SLIDERS) {
          const out = document.querySelector(`[data-cyo="${k}"]`);
          if (out) out.textContent = fmt(st.x[k]);
        }
        if (o.v) {
          $("cyTbl").innerHTML = cyTable(o.v);
          cyPaint(o.v);
        }
      }
      RENDER.CYC = (R) => {
        const st = cyState(),
          I = S.inp,
          mc = cyMC(),
          p = I.market.price;
        st.main = R.base.perShare;
        const o = cyCompute();
        return `
  <div class="title"><h1>CYC · Cycle model — ${st.scen}</h1><div class="sub">Boom, downturn, mid-cycle margin · discount rate moves with beta · reinvestment from sales-to-capital · same price, shares and balance sheet as the main model</div></div>
  <div class="grid">
    <section class="box c4"><h2>Scenario and drivers</h2>
      <div class="seg" role="group" aria-label="Cycle scenario">${Object.keys(I.cycle.scenarios)
        .map((k) => `<button type="button" data-cyscen="${k}" aria-pressed="${k === st.scen}">${k}</button>`)
        .join("")}</div>
      <div class="cyr-list">${CY_SLIDERS.map(
        ([k, lab, lo, hi, step, fmt]) =>
          `<label class="cyr-row"><span>${lab}</span><output data-cyo="${k}">${fmt(st.x[k])}</output><input class="cyr" type="range" data-cy="${k}" min="${lo}" max="${hi}" step="${step}" value="${st.x[k]}" aria-label="${lab}"></label>`,
      ).join("")}</div>
      <p class="note">Drag a slider and the value updates. Switching scenario resets the sliders.</p></section>
    <section class="box c8"><h2>Result</h2><div id="cyKv">${cyKv(o)}</div>
      <h2 style="margin-top:14px">Revenue and EBIT margin</h2><div class="chart"><canvas id="cCY"></canvas></div></section>
    <section class="box"><h2>Reading it</h2><ul class="list note">
      <li>${cyFY(1)} and ${cyFY(2)} follow the Street. Everything after is a judgement: how long the boom lasts, how deep the fall goes, what a normal year earns.</li>
      <li>The price is the line to beat: the implied mid-cycle margin is what the market is paying for, holding the other sliders.</li>
      <li>Not backtested. The existing backtest covers the main model only.</li></ul></section>
    <section class="box"><h2>Year by year <span>$m</span></h2><div class="scroll" id="cyTbl">${o.v ? cyTable(o.v) : ""}</div></section>
    <section class="box c8"><h2>Monte Carlo, ${f0(mc.n)} draws</h2><div class="chart tall"><canvas id="cCYMC"></canvas></div>
      <p class="note">Twenty inputs drawn together, tied by a Gaussian copula. Independent of the sliders. Histogram covers the 1st to 99th percentile.</p></section>
    <section class="box c4"><h2>Statistics</h2><div class="kv">

      async function research(ticker, peerList) {
        const mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
        if (!mcp) throw { code: "no_mcp" };
        const t = ticker.toUpperCase();
        logLine(`Opening Yahoo Finance for ${t} in the Claude app browser…`);
        const opened = textOf(
          await mcp.callTool(HOST, "preview_start", {
            url: `https://finance.yahoo.com/quote/${encodeURIComponent(t)}/`,
          }),
        );
        const m = /tabId\s+([A-Za-z0-9_-]+)/.exec(opened);
        const tabId = m ? m[1] : undefined;
        const page = async (url, label) => {
          if (label) logLine(label);
          await mcp.callTool(HOST, "navigate", tabId ? { url, tabId } : { url });
          return textOf(
            await mcp.callTool(
              HOST,
              "get_page_text",
              tabId ? { tabId, max_chars: 1500000 } : { max_chars: 1500000 },
            ),
          );
        };
        const crumb = RS.bodyOf(await page(RS.Y.crumb, "Getting a Yahoo session token")).split(/\s+/)[0];
        const qs = RS.jsonOf(
          await page(RS.Y.summary(t, crumb), "Quote, consensus estimates, price targets, ratings"),
        ).quoteSummary;
        if (!qs || !qs.result || !qs.result[0]) throw { code: "bad_ticker" };
        const summary = qs.result[0];
        const annual = RS.series(
          RS.jsonOf(
            await page(RS.Y.timeseries(t, "annual"), "Annual income statement, balance sheet, cash flow"),
          ).timeseries.result,
        );
        const quarterly = RS.series(
          RS.jsonOf(await page(RS.Y.timeseries(t, "quarterly"), "Quarterly statements")).timeseries.result,
        );
        const stock = RS.closes(
          RS.jsonOf(await page(RS.Y.chart(t, "2y"), `Two years of daily prices for ${t}`)).chart.result[0],
        );
        const index = RS.closes(
          RS.jsonOf(await page(RS.Y.chart("^GSPC", "2y"), "Two years of daily S&P 500 prices")).chart
            .result[0],
        );
        const tnx = RS.jsonOf(await page(RS.Y.chart("^TNX", "5d"), "10-year Treasury yield")).chart.result[0]
          .meta.regularMarketPrice;
        let peers = peerList;
        if (!peers.length) {
          try {
            peers = (
              RS.jsonOf(await page(RS.Y.recs(t), "Related tickers")).finance.result[0].recommendedSymbols ||
              []
            )
              .map((x) => x.symbol)
              .slice(0, 6);
          } catch (e) {
            peers = [];
          }
        }
        const peerData = {};
        for (const p of peers) {
          try {
            const r = RS.jsonOf(await page(RS.Y.peerSummary(p, crumb), `Peer ${p}`)).quoteSummary;
            peerData[p] = r && r.result ? r.result[0] : null;
            if (!peerData[p]) logLine(`  ${p}: no data, skipped`, "err");
          } catch (e) {
            logLine(`  ${p}: ${e.message || e.code}`, "err");
          }
        }
        logLine("Building the model from the feeds…");
        const inp = RS.build(
          {
            ticker: t,
            summary,
            annual,
            quarterly,
            stock,
            index,
            tnx,
            peers: peerData,
            peer_source: peerList.length ? "user" : "yahoo",
            today: new Date().toISOString().slice(0, 10),
          },
          M,
        );
        if (inp.market.price == null || !inp.rev_y0) throw { code: "bad_ticker" };
        M.dcf(inp, inp.scenarios.Base); // throws on an impossible setup (e.g. g ≥ WACC)
        return inp;
      }
